name: Edge Finder App Export

# Publishes app/latest (the Edge Finder app contract, contract/edge_finder_contract/)
# from the data already committed on main. Pure adapter: scripts/app_export.py reads
# the slate, EdgeLab partitions, the canonical bet ledger and the health artifacts,
# and re-expresses them as the contract's documents. It never touches a model,
# a threshold, a stake or a bet authority, and never reads a secret.
#
# Runs after every producer that changes what the app shows (workflow_run on the
# exact `name:` of each producer), every 30 minutes as a backstop so a producer that
# silently stops firing still surfaces as STALE in app/latest/health.json, and on
# demand. On a failed build the exporter rewrites ONLY health.json (export_failed)
# and exits 1; the last-known-good payload stays in place. The commit step runs
# regardless so that failure health is published, and the final gate propagates
# the exporter's own exit code so the run is red.
#
# Commit mechanics are the shared scripts/ci/git_data_commit.py path, exactly like
# edgelab-daily-heartbeat.yml. Only app/latest/ is ever added (it includes app/latest/explorer/,
# the research graph written by scripts/research_export.py right after the v1 export).

on:
  workflow_run:
    workflows:
      - "Fetch Slate Data"
      - "Build Handicapping Card"
      - "Prospective Model Snapshots (Scheduled)"
      - "EdgeLab Market Capture"
      - "EdgeLab Postgame Settlement"
      - "EdgeLab Settlement Reconcile"
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # scripts/ci/pipeline_watchdog.py lists and dispatches this repository's own MLB producers
  # (fetch-slate / capture-snapshots-scheduled / model-snapshot-scheduler) that GitHub's cron missed.
  actions: write

concurrency:
  group: app-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # 2026-10-07 missed-cron incident: GitHub fired this repository's crons hours late or not
      # at all, so the MLB slate / Kalshi capture / model snapshots never ran. This export runs
      # after every producer, so it re-arms only the producer that is missing or stale, at that
      # producer's own cadence, never on top of a recent or in-flight run (unknown run state =
      # no dispatch). Slate dispatches are unattended=true: scheduled-run semantics, no bet
      # logging. continue-on-error: a watchdog failure can never block the export below.
      - name: Re-arm missed MLB producers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/pipeline_watchdog.py

      - name: Build app/latest from committed data
        id: export
        run: |
          python scripts/app_export.py --out app/latest --commit-sha "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID"

      # The research graph (app/latest/explorer/, scripts/research_export.py) is built right after
      # the v1 export, from the same committed data, as its own command: run_id and --now come
      # from the manifest the v1 export just wrote. continue-on-error so a research failure can
      # never block the v1 publication; the previous explorer tree stays in place on failure
      # (research.publish_explorer is atomic) and the final gate below turns the run red.
      # --min-interval-minutes 180 (research.refresh_due): the 30-minute backstop runs do not
      # rewrite the tree; it is rebuilt when the v1 events change (a new slate) or after 3 hours.
      # A skipped run prints {"skipped": true, "reason": ...} to the step summary and succeeds.
      - name: Build app/latest/explorer (research graph) from committed data
        id: research_export
        if: steps.export.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          python scripts/research_export.py --out app/latest --commit-sha "$GITHUB_SHA" --min-interval-minutes 180 2>&1 \
            | tee "$RUNNER_TEMP/research_export.log" || status=$?
          {
            echo "### Research explorer export (exit $status)"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/research_export.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Commit app/latest incl. explorer/ (always -- a failed build still publishes its health.json)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "app export $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "app/latest/" \
            || echo "DATA-HEALTH WARNING: app/latest push failed."

      - name: Fail the workflow if the export failed
        if: always()
        run: |
          if [ "${{ steps.export.outcome }}" != "success" ]; then
            echo "APP EXPORT FAILED -- app/latest/health.json carries export_failed; payload is last-known-good"
            exit 1
          fi
          if [ "${{ steps.research_export.outcome }}" == "failure" ]; then
            echo "RESEARCH EXPORT FAILED -- app/latest (v1) published; app/latest/explorer is last-known-good"
            exit 1
          fi
          echo "app/latest published (v1 + explorer)."
