name: Capture Kalshi Snapshots (Scheduled)

# Captures Kalshi market prices repeatedly during the MLB slate window.
# This ensures every real-money bet has at least one valid pre-start
# price snapshot for CLV purposes, regardless of when games start.
#
# Schedule: runs every 30 minutes 16:00–06:00 UTC (12pm–2am ET),
# covering the entire MLB window from day games through late West Coast games.
# That is ~28 snapshots per day; any one of them pre-dating a game's first
# pitch is a valid CLV source.
#
# This workflow is intentionally minimal: it fetches prices, archives them,
# and commits.  No model logic, no validation gates, no pipeline steps.
# A failure here does NOT block the main fetch-slate workflow.

on:
  schedule:
    # Every 30 min from 16:00 UTC (12pm ET) to 06:00 UTC next day (2am ET)
    - cron: '0,30 16,17,18,19,20,21,22,23 * * *'   # 16:00-23:30 UTC
    - cron: '0,30 0,1,2,3,4,5 * * *'                # 00:00-05:30 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to snapshot (YYYY-MM-DD). Leave blank for today ET.'
        required: false
        default: ''

jobs:
  capture-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set date
        id: set_date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Snapshotting Kalshi markets for $DATE"

      - name: Fetch Kalshi search markets
        id: fetch_markets
        run: |
          CB=$(date +%s)
          # PHASE G: an attempt that fails must still leave DURABLE EVIDENCE.
          #
          # This step used to `exit 1` on a failed fetch, and the archive step
          # below was gated on markets_count > 0. Between them, a capture that
          # failed and a capture that never ran were indistinguishable in the
          # archive forever after -- which is why the 21-day audit could only
          # ever report a LOWER bound on what was lost.
          #
          # The endpoint now returns a well-formed empty snapshot with
          # captureStatus FAILED (HTTP 200) rather than a bare {error}. If even
          # that does not arrive -- DNS, TLS, a function timeout -- we
          # synthesise the same shape locally so the attempt is still on the
          # record. `-f` is dropped so an error BODY is kept rather than
          # discarded.
          HTTP=$(curl -s -w '%{http_code}' \
            "https://edge-finder-api.vercel.app/api/kalshisearch?_cb=${CB}" \
            -H "Accept: application/json" \
            -H "Cache-Control: no-cache" \
            -o data/kalshi_search_live.json) || HTTP="000"
          echo "kalshisearch HTTP $HTTP"

          if ! python3 -c "import json,sys; d=json.load(open('data/kalshi_search_live.json')); sys.exit(0 if isinstance(d.get('markets'), (list,dict)) else 1)" 2>/dev/null; then
            echo "ERROR: no usable snapshot body (HTTP $HTTP) -- recording a FAILED capture attempt"
            HTTP_STATUS="$HTTP" python3 - <<'PYFAIL'
          import datetime, json, os
          body = None
          try:
              with open("data/kalshi_search_live.json") as fh:
                  body = fh.read()[:2000]
          except OSError:
              pass
          json.dump({
              "date": os.environ.get("DATE", ""),
              "fetched_at": datetime.datetime.now(datetime.timezone.utc)
                            .strftime("%Y-%m-%dT%H:%M:%S.000Z"),
              "total_markets": 0, "markets": [], "results": [],
              "by_type": {}, "by_event": {}, "series_counts": {},
              "discoveredUnknownSeriesMarkets": [], "discoveredUnknownSeriesCount": 0,
              "captureContractVersion": "kalshi_capture_v4",
              "captureStatus": "FAILED", "captureComplete": False,
              "pagination": [], "exclusions": {},
              "fetchFailures": [{"scope": "transport", "url": "api/kalshisearch",
                                 "status": os.environ.get("HTTP_STATUS")}],
              "fetchFailureCount": 1, "priceFetchFailureCount": 1,
              "captureError": "no usable snapshot body from api/kalshisearch",
              "captureErrorBody": body,
          }, open("data/kalshi_search_live.json", "w"), separators=(",", ":"))
          PYFAIL
          fi
          echo "kalshi_search_live.json: $(wc -c < data/kalshi_search_live.json) bytes"

          # Verify it has content
          MARKETS=$(python3 -c "
          import json
          with open('data/kalshi_search_live.json') as f:
              d = json.load(f)
          markets = d.get('markets', [])
          if isinstance(markets, dict):
              markets = list(markets.values())
          print(len(markets))
          " 2>/dev/null || echo "0")
          echo "markets_count=$MARKETS" >> $GITHUB_OUTPUT
          echo "Markets found: $MARKETS"

          if [ "$MARKETS" -lt 10 ]; then
            echo "WARNING: Only $MARKETS markets found — possibly stale or empty response"
          fi

      # PHASE G: archive UNCONDITIONALLY. `markets_count > 0` was the
      # condition that made a failed capture leave no trace at all; a capture
      # that retrieved nothing is exactly the one worth having a record of.
      - name: Archive snapshot with timestamp
        id: archive
        run: |
          SNAP_DIR="data/kalshi_registry_snapshots"
          DATE="${{ env.DATE }}"
          TS=$(date -u +%H%M)
          # Primary dated snapshot (overwrite with latest if same date)
          SNAP_DATE="${SNAP_DIR}/kalshi_search_${DATE}.json"
          # Timestamped snapshot (for multi-snapshot CLV precision)
          SNAP_TS="${SNAP_DIR}/kalshi_search_${DATE}_${TS}.json"

          mkdir -p "$SNAP_DIR"

          # Add fetch timestamp to the JSON
          python3 - << 'EOF'
          import json, datetime, sys, os
          with open('data/kalshi_search_live.json') as f:
              d = json.load(f)
          d['fetched_at'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z')
          d['date'] = os.environ.get('DATE', '')
          with open('data/kalshi_search_live.json', 'w') as f:
              json.dump(d, f, separators=(',', ':'))
          EOF

          # The TIMESTAMPED copy is always written: it is the record that this
          # attempt happened, and recording a failed attempt is the entire
          # point of archiving unconditionally.
          cp data/kalshi_search_live.json "$SNAP_TS"
          echo "snapshot_ts_path=$SNAP_TS" >> $GITHUB_OUTPUT
          echo "Archived: $SNAP_TS"

          # The DATED copy is different. lib/snapshot_retention.py keeps it
          # FOREVER as the per-slate-date reference other consumers reconcile
          # against, and it is overwritten in place by each capture. Letting a
          # capture that retrieved NOTHING clobber a good one would destroy
          # evidence in the name of recording it -- turning a transient fetch
          # failure into permanent data loss on the one file that is never
          # pruned.
          #
          # So it is advanced only by a capture that actually retrieved
          # markets. The failed attempt is fully recorded in the timestamped
          # file either way, and the completeness ledger reads both.
          if [ "${{ steps.fetch_markets.outputs.markets_count }}" -gt 0 ]; then
            cp data/kalshi_search_live.json "$SNAP_DATE"
            echo "snapshot_date_path=$SNAP_DATE" >> $GITHUB_OUTPUT
            echo "Archived: $SNAP_DATE"
          else
            echo "NOT advancing $SNAP_DATE: this capture retrieved 0 markets."
            echo "The attempt is recorded in $SNAP_TS; the kept-forever dated"
            echo "reference is left pointing at the last capture that succeeded."
          fi
          
          # Prune old timestamped snapshots (dated per-slate-date files are
          # always kept forever -- see lib/snapshot_retention.py).
          #
          # Production Reliability and Settlement Recovery milestone: this
          # step previously used `find ... -mtime +3 -delete`, which checks
          # the FILESYSTEM's modification time. actions/checkout does a
          # fresh checkout on every run, so every file's mtime is "now"
          # (checkout time), never the date embedded in its own filename --
          # `-mtime +3` could therefore never match anything on a real
          # runner, and silently pruned nothing (confirmed: this archive
          # still held timestamped files back to 2026-06-08 despite this
          # step's stated "3 days" intent). scripts/prune_kalshi_snapshots.py
          # parses the date FROM THE FILENAME instead, so it actually
          # enforces the window. Also widens 3 days -> 21 days: this same
          # milestone found real settlement/CLV runs that went unnoticed
          # for weeks, and a snapshot pruned before anyone notices a failed
          # run can't be used to recover it (see
          # docs/POSTMORTEM_PRODUCTION_RELIABILITY_2026.md).
          python3 scripts/prune_kalshi_snapshots.py --execute

          rm -f data/kalshi_search_live.json

      # Gated on the TIMESTAMPED path, not the dated one. The dated copy is
      # deliberately not advanced by a capture that retrieved nothing (see
      # above), so gating the commit on it would write a failed attempt to the
      # runner's disk and then throw it away when the runner is reclaimed --
      # no artifact, which is the exact defect PHASE G exists to close.
      - name: Commit snapshot
        if: steps.archive.outputs.snapshot_ts_path != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "kalshi snapshot ${{ env.DATE }} $(date -u +'%H:%M UTC')" \
            data/kalshi_registry_snapshots/ \
            || echo "Push failed — will retry on next schedule run"
