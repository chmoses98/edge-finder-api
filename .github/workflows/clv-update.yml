name: Update CLV (Post-Slate Review)
# Trigger: workflow_dispatch (manual) and schedule (daily 06:00 UTC / 1 AM ET)
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to pull closing lines for (YYYY-MM-DD). Leave blank for yesterday ET.'
        required: false
        default: ''
      skip_settlement:
        description: 'Skip score settlement (only refresh CLV)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-clv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve date
        id: date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d 'yesterday' +%Y-%m-%d 2>/dev/null || \
                   TZ='America/New_York' date -v-1d +%Y-%m-%d)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved date: $DATE"

      - name: Restore date-specific slate
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "Restoring slate for $DATE"
          SLATE_COMMIT=$(git log --oneline --format="%H %s" -- data/slate.json | grep "slate data $DATE" | head -1 | awk '{print $1}')
          if [ -n "$SLATE_COMMIT" ]; then
            echo "  Found slate commit: $SLATE_COMMIT"
            git show "$SLATE_COMMIT:data/slate.json" > data/slate.json
            echo "  Restored data/slate.json from $SLATE_COMMIT"
          else
            echo "  No date-specific slate found for $DATE -- using current slate"
          fi

      - name: Run CLV update (settlement + Pinnacle CLV)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "=== Step 1: Settlement + Pinnacle CLV via clv_update.py ==="
          python3 clv_update.py "$DATE"

      - name: Snapshot coverage check (warns if CLV source missing)
        continue-on-error: true
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "=== Step 2a: Snapshot coverage check ==="
          python3 scripts/snapshot_coverage_check.py "$DATE" || true
          echo "Coverage check complete (non-blocking)"

      - name: Run Kalshi CLV (snapshot-first, API fallback)
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "=== Step 2b: Kalshi CLV — snapshot primary, API fallback ==="
          python3 scripts/run_kalshi_clv_step.py "$DATE" 

      - name: Run identity audit
        run: |
          echo "=== Step 3: Identity Audit ==="
          python3 scripts/run_identity_audit.py

      - name: Run Rule 71 tracking report
        run: |
          echo "=== Step 4: Rule 71 Tracking Report ==="
          python3 scripts/run_rule71_report.py

      - name: Commit all updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bets.json BET_LOG.md data/identity_audit.json data/rule71_report.json || true
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "clv update + rule71 report $(TZ='America/New_York' date +'%Y-%m-%d %H:%M ET')" && \
             (git fetch origin main && git pull --rebase origin main && git push origin main || \
              (git fetch origin main && git pull --rebase origin main && git push origin main)))
