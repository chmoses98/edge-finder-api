name: EdgeLab Corpus Health Check

# PR #37 maintainer review (item 10, "workflow failure policy"): the
# DEDICATED check that surfaces forward-replay-corpus degradation before
# it becomes a long-term, invisible gap. Before this workflow existed,
# scripts/corpus_health_report.py computed a consecutiveDegradedRuns
# signal and an ALERT: line, but nothing in this repository ever ran it
# automatically, and the script always exited 0 regardless of what it
# found -- a check that can neither run nor fail is not a check.
#
# Same pattern as .github/workflows/snapshot-capture-check.yml: a
# SEPARATE workflow from fetch-slate.yml/edgelab-postgame.yml, which
# wrap their own snapshot/replay steps in continue-on-error: true because
# production slate publication must remain possible even if this
# research-only infrastructure breaks. This workflow is the thing that IS
# allowed to fail -- scripts/corpus_health_report.py now exits 1 for
# actionable FORWARD-era problems (see its own module docstring for the
# full rule table), and this workflow has no continue-on-error on that
# step, so a real, accumulating degradation is visible as a red check
# rather than silence.
#
# Second maintainer review of PR #37 ("must not begin life red solely
# because historical backfill dates predate the new forward-capture
# system"): the script now separates historical corpus quality
# (descriptive only, never fails) from forward operational health (drives
# the exit code), gated on a persisted, immutable enforcement boundary --
# the first date with a real, GITHUB_SHA-based forward capture. Before
# that boundary exists, this check always passes
# (AWAITING_FIRST_FORWARD_CAPTURE) rather than reporting false HEALTHY or
# false-failing on data that was never supposed to have forward-grade
# provenance in the first place. See scripts/corpus_health_report.py's
# module docstring for the full policy.
#
# Read-only against production files: only writes
# data/edgelab/reports/corpus_health_report.{json,md}, (once, ever)
# data/edgelab/corpus_enforcement_boundary.json, and (once per date, only
# for empty-slate forward dates) data/edgelab/schedule_evidence/<date>.json.

on:
  schedule:
    - cron: '0 7 * * *'  # ~2am ET -- after snapshot-capture-check.yml's typical 1:30am ET run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: corpus-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      # 2026-10-02 reliability cleanup: ONE pass/fail decision per run.
      #
      # Before, the report step itself exited 1 on a failing verdict, the
      # commit step ran under `if: always()`, and a final step re-raised the
      # report step's outcome -- two red steps for one fact, and a crash of
      # the report script was indistinguishable from a legitimate FAILED
      # verdict. Now:
      #   1. the report step always writes the report and exits 0 when it
      #      succeeds in doing so (--report-only); it exits non-zero ONLY
      #      if the report could not be built at all;
      #   2. the report (plus the immutable enforcement boundary and any
      #      newly-obtained MLB schedule evidence) is committed;
      #   3. the enforcement step is the single place the workflow can turn
      #      red: it fails if the report could not be built, or if the
      #      report's operationalHealth.state is FAILED. HEALTHY,
      #      DEGRADED (postgame data still pending -- surfaced as a warning
      #      annotation and in the step summary) and NOT_APPLICABLE pass.
      # Nothing here is continue-on-error, and no verdict is downgraded:
      # every condition that failed this workflow before still fails it,
      # except a date the MLB schedule itself verifies had no games (see
      # STATUS_FORWARD_NO_SLATE in scripts/corpus_health_report.py).
      - name: Build corpus health report
        id: report
        run: python3 scripts/corpus_health_report.py --report-only

      - name: Commit refreshed report
        if: always() && steps.report.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! python3 scripts/ci/git_data_commit.py \
            --message "corpus health report $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "data/edgelab/reports/corpus_health_report.json" "data/edgelab/reports/corpus_health_report.md" \
            "data/edgelab/corpus_enforcement_boundary.json" \
            "data/edgelab/schedule_evidence/"; then
            # The verdict below does not depend on the push; the published
            # copy is simply one run stale until the next run succeeds.
            echo "::warning title=Corpus health report not published::push failed after retries; the enforcement verdict below is unaffected."
          fi

      - name: Enforce corpus health (the only step that decides pass/fail)
        if: always()
        run: |
          if [ "${{ steps.report.outcome }}" != "success" ]; then
            echo "::error title=Corpus health report could not be built::see the 'Build corpus health report' step log."
            exit 1
          fi
          python3 scripts/corpus_health_report.py --enforce
