name: Discover Kalshi MLB Markets

# Universal Kalshi MLB market discovery (docs/KALSHI_MLB_MARKET_COVERAGE_AUDIT.md).
# Runs automatically after "Fetch Slate Data" completes (so discovery
# always has a fresh data/kalshi_search.json + data/slate.json to read),
# and supports manual workflow_dispatch for backfills/testing.
#
# This workflow is read/classify/write only: it runs
# scripts/discover_kalshi_mlb_markets.py, which reads already-fetched
# data (never makes its own live Kalshi calls), classifies every
# discovered contract, computes a fair probability for every family this
# repository can support, and writes data/kalshi/discovery/<date>.json +
# <date>_summary.json. It never touches bets.json, marketLedger,
# risk_gate, or write_pending_bets.

on:
  workflow_run:
    workflows: ["Fetch Slate Data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to discover (YYYY-MM-DD). Leave blank for today ET.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: discover-kalshi-mlb-markets
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set date
        id: set_date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "Discovering Kalshi MLB markets for $DATE"

      - name: Run universal market discovery
        run: python3 scripts/discover_kalshi_mlb_markets.py "${{ env.DATE }}"

      - name: Build paper spread ledger (Rule-81/not-yet-activated spread paper tracking)
        run: python3 scripts/build_paper_spread_ledger.py "${{ env.DATE }}"

      - name: Run prefix-agnostic series catalogue + F3/F7 search
        run: python3 scripts/discover_kalshi_series_catalogue.py "${{ env.DATE }}"
        continue-on-error: true

      - name: Commit discovery output (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "kalshi mlb discovery: ${{ env.DATE }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "data/kalshi/discovery/${{ env.DATE }}.json" \
            "data/kalshi/discovery/${{ env.DATE }}_summary.json" \
            "data/kalshi/discovery/${{ env.DATE }}_series_catalogue.json" \
            "data/kalshi/discovery/${{ env.DATE }}_f3_f7_search.json" \
            "data/research/paper_spread_ledger.jsonl"
