name: EdgeLab Market + CLV Capture

# EdgeLab Phase 1 (see docs/EDGELAB_PHASE1.md): normalizes the already-
# captured Kalshi registry snapshots into the versioned research schema
# under data/edgelab/. Makes ZERO Kalshi API calls of its own — it reads
# data/kalshi_registry_snapshots/*.json, already written by "Capture
# Kalshi Snapshots (Scheduled)" and "CLV Pregame Snapshot Capture", and
# data/pipeline/<date>/*.json, already written by "Fetch Slate Data".
#
# Runs automatically after either of those two capture workflows
# completes (whichever fires last wins the race — both scripts here are
# idempotent re-reads of whatever snapshot files currently exist, so
# running twice in quick succession is harmless), on a supported
# fallback schedule, and supports manual workflow_dispatch for a
# standalone capture/backfill run.
#
# This workflow only ever writes under data/edgelab/ — it never touches
# bets.json, data/bets.json, data/slate.json, marketLedger, risk_gate
# output, or any other production file. A failure here never fails
# "Fetch Slate Data" or any production workflow (they don't depend on
# this one), and this workflow's own commit failures are non-fatal to
# the underlying capture workflows since it runs strictly after them.

on:
  workflow_run:
    workflows: ["Capture Kalshi Snapshots (Scheduled)", "CLV Pregame Snapshot Capture"]
    types: [completed]
  schedule:
    # Fallback in case both workflow_run triggers are ever missed —
    # matches capture-snapshots-scheduled.yml's own MLB-window cadence.
    - cron: '20,50 16,17,18,19,20,21,22,23 * * *'
    - cron: '20,50 0,1,2,3,4,5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to ingest (YYYY-MM-DD). Leave blank for today ET.'
        required: false
        default: ''
      all_snapshots:
        description: 'Ingest every snapshot file for the date, not just the latest (backfill)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: edgelab-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set date
        id: set_date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "EdgeLab capture for $DATE"

      - name: Ingest market observations (full universe, no API calls)
        run: |
          ARGS="--date ${{ env.DATE }}"
          if [ "${{ github.event.inputs.all_snapshots }}" = "true" ]; then
            ARGS="$ARGS --all-snapshots"
          fi
          python3 scripts/edgelab/ingest_market_observations.py $ARGS

      - name: Collect CLV quotes + backfill pending bets
        run: python3 scripts/edgelab/collect_clv.py --date "${{ env.DATE }}"
        continue-on-error: true

      - name: Commit EdgeLab capture output (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase --autostash origin/main

          git add "data/edgelab/observations/${{ env.DATE }}.jsonl" \
                  "data/edgelab/games/${{ env.DATE }}.jsonl" \
                  "data/edgelab/markets/${{ env.DATE }}.jsonl" \
                  "data/edgelab/clv_quotes/${{ env.DATE }}.jsonl" \
                  "data/edgelab/bets/bets.jsonl" \
                  "data/edgelab/research_runs/${{ env.DATE }}.jsonl" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No EdgeLab capture changes to commit"
            exit 0
          fi

          git commit -m "edgelab capture: ${{ env.DATE }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "EdgeLab capture push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Push failed (attempt $attempt) — re-fetching and rebasing before retry..."
            git fetch origin main
            git rebase origin/main || { echo "ERROR: rebase failed while retrying push — aborting" >&2; exit 1; }
            sleep $((attempt * 5))
          done

          echo "ERROR: EdgeLab capture commit could not be pushed after all retries" >&2
          exit 1
