name: EdgeLab Daily Pipeline Heartbeat

# Pipeline Health Incident guardrail (2026-08-24): two separate, silent,
# multi-day production outages were found and fixed this mission --
# fetch-slate.yml had no schedule trigger of its own for its entire
# history (data/pipeline/<date>/recommendations.json and the
# PRE_GAME_DECISION snapshot silently stopped refreshing for
# 2026-08-11..15 whenever nobody remembered to workflow_dispatch it),
# and RECOMMENDATION_SYNC's full-universe ModelEvaluation extension
# silently produced zero rows from 2026-08-18 onward after
# build_recommendations.py started importing duckdb without the
# workflow installing it (masked by continue-on-error). Neither was a
# model-logic bug -- both were the absence of any signal that says
# "today's expected artifacts don't exist." This workflow is that
# signal.
#
# DELIBERATELY INDEPENDENT: no workflow_run trigger off fetch-slate.yml,
# edgelab-postgame.yml, RECOMMENDATION_SYNC, or snapshot-capture-check.yml
# -- the entire point is to detect the absence of those systems, so this
# workflow must never depend on any of them firing. Its own schedule is
# its only trigger (plus workflow_dispatch for manual checks). See
# scripts/edgelab/daily_health_check.py's own docstring for the same
# independence guarantee on the script side (a live, unauthenticated MLB
# Stats API call, never a read of any of this repo's own workflow state).
#
# ONE run per day is sufficient, timed at 23:45 UTC (deliberately late):
#   - covers TODAY's recommendations.json / PRE_GAME_DECISION snapshot,
#     both produced only by fetch-slate.yml's own cron (16:00/20:00/22:00
#     UTC) -- 23:45 UTC gives 1h45m margin past its last attempt.
#   - covers YESTERDAY's settlement + RECOMMENDATION_SYNC full-universe
#     extension, both produced by edgelab-postgame.yml's own morning run
#     (~06:00-07:45 UTC the day after) -- by 23:45 UTC that's 16+ hours
#     of margin, and yesterday's games are unambiguously final.
# A single run covering both dayparts is simpler than two separate
# triggers and was sufficient to catch both historical regressions when
# tested against real archived production data (see the PR description).
#
# TARGET DATE = THE INTENDED CHECKPOINT'S DATE, NEVER THE START TIME'S
# (Heartbeat False-Failure Incident, 2026-08-27): GitHub Actions cron is
# best-effort, and every one of this workflow's first four scheduled
# runs actually started AFTER midnight UTC (15m, 15m, 5h21m, 7h20m late
# -- run ids 32791805788, 32913256608, 33041444748, 33150188258). The
# health script used to take its date from the wall clock at process
# start, so each of those runs validated the NEXT production date, hours
# before that date's own slate cycle had begun, and reported a full
# sheet of MISSING_* failures that were pure false positives. The
# "Resolve heartbeat target date" step below now resolves the date ONCE,
# from this run's own `github.event.schedule` cron literal floored
# against a re-run-durable anchor (the run's REST created_at), and hands
# it to the health check explicitly. Delay -- and a re-run days later --
# can no longer change the date being validated. All of the semantics
# live in lib/edgelab/production_date.py; nothing about the cron is
# duplicated in Python, so changing the schedule above changes the
# resolution with it. Manual dispatch keeps its own semantics: an
# explicit `date` input wins outright, and a blank one means today's
# America/New_York production date, the same convention fetch-slate.yml
# and every other daily workflow here uses.
#
# Writes only data/edgelab/health/<target production date>.json (the
# date being validated -- the record's own `checkedAt` keeps the real
# execution timestamp, so a delayed run never overwrites the health
# artifact of the later date it happened to start on) -- never touches
# data/pipeline/, data/edgelab/{recommendations,model_evaluations,
# settlements,snapshots}/, bets.json, or any production/model file.

on:
  schedule:
    - cron: '45 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to check (YYYY-MM-DD). Leave blank for today ET.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: edgelab-daily-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      # The ONE date-resolution path (see this file's header and
      # lib/edgelab/production_date.py). Deliberately NOT continue-on-error
      # and deliberately BEFORE the health check: if the target date cannot
      # be resolved deterministically, the correct outcome is a loud red
      # heartbeat, never a health check quietly falling back to the wall
      # clock and validating the wrong day.
      - name: Resolve heartbeat target date
        id: target
        env:
          HEARTBEAT_DISPATCH_DATE: ${{ github.event.inputs.date }}
          HEARTBEAT_SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          # github.run_started_at RESETS on a re-run; it is only the
          # last-resort anchor. The resolver prefers this run's REST
          # created_at, which survives re-runs, and records in the
          # artifact which one it actually used.
          HEARTBEAT_RUN_STARTED_AT: ${{ github.run_started_at }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/edgelab/resolve_heartbeat_target.py \
            --out "${RUNNER_TEMP}/heartbeat_target_date.json" \
            --github-output

      - name: Run daily pipeline health check
        id: health
        run: |
          python3 scripts/edgelab/daily_health_check.py \
            --date "${{ steps.target.outputs.target_date }}" \
            --resolution-file "${RUNNER_TEMP}/heartbeat_target_date.json"

      - name: Commit health artifact (always -- even if the check above will fail)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "edgelab daily heartbeat $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "data/edgelab/health/" \
            || echo "DATA-HEALTH WARNING: heartbeat artifact push failed."

      # Deliberately the LAST step and deliberately NOT continue-on-error:
      # this is what makes the workflow's own conclusion trustworthy. The
      # health-check step above already exits non-zero for a genuine
      # UNHEALTHY day (see scripts/edgelab/daily_health_check.py /
      # lib/edgelab/daily_health.py), so this workflow simply propagates
      # that -- an unhealthy daily state can never be silently turned
      # green by a later step's own success.
      - name: Fail the workflow if today's pipeline health is unhealthy
        if: always()
        run: |
          if [ "${{ steps.health.outcome }}" != "success" ]; then
            echo "EDGELAB DAILY PIPELINE UNHEALTHY -- see the health-check step above and data/edgelab/health/ for exact reasons"
            exit 1
          fi
          echo "EdgeLab daily pipeline OK."
