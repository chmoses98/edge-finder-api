name: EdgeLab Daily Research Report

# EdgeLab Phase 1 (see docs/EDGELAB_PHASE1.md): generates the daily
# research report (data/edgelab/reports/<date>.md + .json + a
# calibration export) from that date's already-written EdgeLab
# partitions. Pure aggregation — no new collection, no network calls.
#
# Runs automatically after "EdgeLab Postgame Settlement" completes (so
# the report reflects that date's settlement), on a nightly fallback
# schedule, and supports manual workflow_dispatch.

on:
  workflow_run:
    workflows: ["EdgeLab Postgame Settlement"]
    types: [completed]
  schedule:
    # Nightly fallback: 08:00 UTC, after edgelab-postgame.yml's expected run.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to report on (YYYY-MM-DD). Leave blank for yesterday ET.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: edgelab-daily-report
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set date
        id: set_date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d '1 day ago' +%Y-%m-%d)
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "EdgeLab daily report for $DATE"

      - name: Generate daily research report
        run: python3 scripts/edgelab/generate_daily_report.py --date "${{ env.DATE }}"

      - name: Commit report (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase --autostash origin/main

          git add "data/edgelab/reports/${{ env.DATE }}.md" \
                  "data/edgelab/reports/${{ env.DATE }}.json" \
                  "data/edgelab/reports/${{ env.DATE }}_calibration.jsonl"

          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi

          git commit -m "edgelab daily report: ${{ env.DATE }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "EdgeLab report push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Push failed (attempt $attempt) — re-fetching and rebasing before retry..."
            git fetch origin main
            git rebase origin/main || { echo "ERROR: rebase failed while retrying push — aborting" >&2; exit 1; }
            sleep $((attempt * 5))
          done

          echo "ERROR: EdgeLab report commit could not be pushed after all retries" >&2
          exit 1
