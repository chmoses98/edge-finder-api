name: EdgeLab Daily Research Report

# EdgeLab Phase 1 (see docs/EDGELAB_PHASE1.md): generates the daily
# research report (data/edgelab/reports/<date>.md + .json + a
# calibration export) from that date's already-written EdgeLab
# partitions. Pure aggregation — no new collection, no network calls.
#
# Runs automatically after "EdgeLab Postgame Settlement" completes (so
# the report reflects that date's settlement), on a nightly fallback
# schedule, and supports manual workflow_dispatch.

on:
  workflow_run:
    workflows: ["EdgeLab Postgame Settlement"]
    types: [completed]
  schedule:
    # Nightly fallback: 08:00 UTC, after edgelab-postgame.yml's expected run.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to report on (YYYY-MM-DD). Leave blank for yesterday ET.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: edgelab-daily-report
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set date
        id: set_date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d '1 day ago' +%Y-%m-%d)
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "EdgeLab daily report for $DATE"

      - name: Generate daily research report
        run: python3 scripts/edgelab/generate_daily_report.py --date "${{ env.DATE }}"

      - name: Commit report (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "edgelab daily report: ${{ env.DATE }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "data/edgelab/reports/${{ env.DATE }}.md" \
            "data/edgelab/reports/${{ env.DATE }}.json" \
            "data/edgelab/reports/${{ env.DATE }}_calibration.jsonl"

      # Corpus Storage Growth mission: this nightly slot (08:00 UTC, well
      # after the ET day rolls over) is the natural once-daily point to
      # gzip-compact every settlements/clv_quotes/model_evaluations/
      # markets/recommendations date EXCEPT the most recent one -- a date
      # only ever becomes eligible once nothing is writing to it anymore,
      # which by this point in the day is every date except today's. This
      # step never touches projection/recommendation/fee/bankroll/
      # settlement logic, model_evaluation MEANING, or the CONTENT of any
      # record -- it only changes a finalized file's on-disk suffix from
      # .jsonl to .jsonl.gz, verified record-for-record identical before
      # the original is ever removed (see lib.edgelab.storage.
      # compact_partition_to_gzip). Runs unconditionally (always()) so a
      # failure in the (unrelated) report step above never blocks the
      # repository from staying lean.
      - name: Compact finalized EdgeLab partitions
        if: always()
        run: python3 scripts/edgelab/compact_edgelab_partitions.py

      - name: Commit compacted partitions (only if changed)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "edgelab corpus compaction $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            data/edgelab/settlements/ data/edgelab/clv_quotes/ \
            data/edgelab/model_evaluations/ data/edgelab/markets/ \
            data/edgelab/recommendations/ data/edgelab/research_runs/
