name: EdgeLab Hitter Hit Historical Audit

on:
  push:
    branches:
      - audit/hitter-hit-outcome-reconciliation
  pull_request:
    paths:
      - "scripts/edgelab/audit_hitter_hit_coverage.py"
      - "tests/edgelab/test_hitter_hit_coverage.py"
      - ".github/workflows/edgelab-hitter-hit-audit.yml"
      - "scripts/edgelab/verify_kalshi_hitter_hit_results.py"
      - "tests/edgelab/test_verify_kalshi_hitter_hit_results.py"
      - "scripts/edgelab/audit_partition_provenance.py"
      - "tests/edgelab/test_partition_provenance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Exact ticker outcome and model-join coverage
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run exact-ticker audit unit tests
        run: |
          python -m unittest discover -s tests/edgelab -p 'test_hitter_hit_coverage.py' -v
          python -m unittest discover -s tests/edgelab -p 'test_verify_kalshi_hitter_hit_results.py' -v
          python -m unittest discover -s tests/edgelab -p 'test_partition_provenance.py' -v

      - name: Audit original August 1-20 market and settlement archives
        run: |
          mkdir -p artifacts
          python scripts/edgelab/audit_hitter_hit_coverage.py \
            --start-date 2026-08-01 --end-date 2026-08-20 \
            --out artifacts/hitter_hit_coverage_aug_01_20.json

      - name: Census independent archive partitions (read only)
        run: |
          python scripts/edgelab/audit_partition_provenance.py \
            --start-date 2026-08-01 --end-date 2026-08-20 \
            --output artifacts/hitter_hit_partition_provenance_aug_01_20.json

      - name: Read official exchange results for EVERY archived hitter-hit ticker (no writes)
        run: |
          python scripts/edgelab/verify_kalshi_hitter_hit_results.py \
            --manifest artifacts/hitter_hit_coverage_aug_01_20.json \
            --out artifacts/hitter_hit_exchange_reconciliation.json

      - name: Publish diagnostics summary
        if: success()
        run: |
          python - <<'PY'
          import json
          path = "artifacts/hitter_hit_coverage_aug_01_20.json"
          r = json.load(open(path))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Historical MLB hitter-hit outcome/forecast coverage\n\n")
              f.write(f"- Unique tracked tickers: **{r['uniqueMarketTickers']:,}**\n")
              f.write(f"- Market/checkpoint rows: **{r['checkpointRows']:,}**\n")
              baseline = 23295
              delta = baseline - r["checkpointRows"]
              f.write(f"- Original Aug 20 report denominator: **{baseline:,}**; currently recovered: **{r['checkpointRows']:,}**; discrepancy: **{delta:,}**\n")
              f.write("- Denominators are not interchangeable until source partitions and report versions are reconciled.\n")
              f.write(f"- Recorded SETTLED tickers: **{r['recordedSettledTickers']:,}**\n")
              f.write(f"- Recorded SETTLED checkpoints: **{r['recordedSettledCheckpointRows']:,}**\n")
              f.write(f"- PIT model-joined tickers: **{r['modelLinkedTickers']:,}**\n")
              f.write(f"- PIT model-joined checkpoints: **{r['modelLinkedCheckpointRows']:,}**\n")
              f.write("- This is archived MLB-derived outcome evidence, not Kalshi-native exchange-result verification.\n")
          PY

      - name: Cross-check independent audit artifacts and expose exceptions
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          coverage = json.loads(Path("artifacts/hitter_hit_coverage_aug_01_20.json").read_text())
          exchange = json.loads(Path("artifacts/hitter_hit_exchange_reconciliation.json").read_text())
          partitions = json.loads(Path("artifacts/hitter_hit_partition_provenance_aug_01_20.json").read_text())
          assert exchange["uniqueTrackedTickers"] == coverage["uniqueMarketTickers"], "ticker denominator drift"
          assert exchange["checkpointRows"] == coverage["checkpointRows"], "checkpoint denominator drift"
          assert sum(exchange["exchangeClassificationCounts"].values()) == exchange["uniqueTrackedTickers"], "exchange classification drift"
          assert set(partitions["entities"]) == {"observations", "settlements", "model_evaluations"}, "incomplete partition census"
          for name, entity in partitions["entities"].items():
              assert sum(entity["byPartitionDate"].values()) == entity["recordCount"], f"{name} partition count drift"
              assert len(entity["byPartitionDate"]) == entity["partitionCount"], f"{name} partition inventory drift"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\\n### Independent cross-artifact reconciliation\\n")
              summary.write(f"- Exchange-confirmed binary tickers: **{exchange['officialBinaryConfirmedTickers']:,}**\\n")
              summary.write(f"- Recorded outcome conflicts: **{exchange['recordedResultConflicts']:,}**\\n")
              summary.write(f"- Official binary missing in recorded settlements: **{exchange['officialBinaryMissingFromRecorded']:,}**\\n")
              summary.write(f"- Recorded settled without official binary confirmation: **{exchange['recordedSettledWithoutOfficialBinary']:,}**\\n")
              for name, entity in partitions["entities"].items():
                  summary.write(f"- {name}: **{entity['recordCount']:,} raw records** in **{entity['partitionCount']} partitions**\\n")
              summary.write("- Raw records, unique tickers, and checkpoint rows are distinct denominators. This check does not establish historical PIT model joins.\\n")
          PY

      - name: Upload exact-ticker unresolved manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitter-hit-historical-audit
          path: |
            artifacts/hitter_hit_coverage_aug_01_20.json
            artifacts/hitter_hit_exchange_reconciliation.json
            artifacts/hitter_hit_partition_provenance_aug_01_20.json
          if-no-files-found: warn
          retention-days: 30
