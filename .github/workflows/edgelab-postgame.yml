name: EdgeLab Postgame Settlement

# EdgeLab Phase 1 (see docs/EDGELAB_PHASE1.md): syncs the decision-layer
# ledger from that date's finalized data/pipeline/<date>/recommendations.json
# + execution.json, then settles every observed market for that date
# (not only placed bets — see lib/edgelab/settlement.py), then re-runs
# the legacy bet-ledger backfill so any bet settled by "Update CLV
# (Post-Slate Review)" is reflected in the EdgeLab ledger too.
#
# Since Phase 2 Milestone 3 (docs/EDGELAB_MODEL_EVALUATION.md), the
# "Sync recommendation / pass-decision ledger" step also builds the
# parallel ModelEvaluation ledger from the same source rows and backfills
# any already-logged PlacedBet's recommendationId/modelEvaluationId.
#
# Runs automatically after "Update CLV (Post-Slate Review)" completes,
# and supports manual workflow_dispatch. Defaults to YESTERDAY's ET date
# since this fires ~06:00 UTC (~1-2am ET), after the prior day's games
# have finished — pass --date explicitly (via workflow_dispatch) to
# settle a different date or re-run a date whose settlement was
# incomplete (e.g. a delayed/suspended game finishing later).
#
# Aug 11 2026 game-identity repair mission: runs
# scripts/edgelab/repair_game_identity.py immediately before settlement
# so a standalone/manual-only betting day (no data/pipeline/<date>/
# normalized_slate.json ever ran) still gets its Game rows' mlbGamePk
# resolved -- via a live MLB Stats API schedule-by-date fetch
# (lib/edgelab/mlb_schedule.py), the pipeline-slate pass's existing
# fallback, kept as the first-tried source. Never guesses an ambiguous
# match (e.g. an unresolvable doubleheader leg) -- that game is simply
# left mlbGamePk=null, exactly as settle_markets.py already handles.
#
# Only ever writes under data/edgelab/ — never touches bets.json,
# data/bets.json, or any production ledger/pipeline file. Network
# failures fetching a final score are recorded as run warnings and an
# explicit SETTLEMENT_UNRESOLVED reason per market, never a crash and
# never a guessed result (see scripts/edgelab/settle_markets.py).

on:
  workflow_run:
    workflows: ["Update CLV (Post-Slate Review)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to settle (YYYY-MM-DD). Leave blank for yesterday ET.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: edgelab-postgame
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      # Pipeline Health Incident (2026-08-24): "Sync recommendation /
      # pass-decision ledger" below has been crashing at import time with
      # `ModuleNotFoundError: No module named 'duckdb'` on every run since
      # 2026-08-17 (commit 485efd69 made scripts/edgelab/build_recommendations.py
      # import lib.edgelab.analytics.open_session, which imports duckdb --
      # a real dependency, listed in requirements-ci.txt, that this
      # workflow never installed). continue-on-error: true on that step
      # silently swallowed every failure, so RECOMMENDATION_SYNC produced
      # zero ModelEvaluation full-universe-extension coverage for over a
      # week while the workflow's own conclusion stayed green. This step
      # installs the same two third-party packages pr-ci.yml already
      # installs for the identical import surface (see requirements-ci.txt's
      # own docstring: duckdb + PyYAML are the only third-party packages
      # this repo's Python actually imports) -- no other step in this job
      # has ever needed a third-party package, so this is deliberately the
      # only place a Python/pip setup is added.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Set date
        id: set_date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d '1 day ago' +%Y-%m-%d)
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "EdgeLab postgame settlement for $DATE"

      - name: Sync recommendation / pass-decision ledger
        run: python3 scripts/edgelab/build_recommendations.py --date "${{ env.DATE }}"
        continue-on-error: true

      - name: Repair MLB game identity (pipeline slate, then live schedule fallback)
        run: python3 scripts/edgelab/repair_game_identity.py --date "${{ env.DATE }}"
        continue-on-error: true

      - name: Settle full observed market universe
        run: python3 scripts/edgelab/settle_markets.py --date "${{ env.DATE }}"
        continue-on-error: true

      - name: Re-ingest legacy bet ledgers (pick up newly settled bets)
        run: python3 scripts/edgelab/ingest_existing_bets.py
        continue-on-error: true

      # Historical Capture Completeness and Immutable Snapshot Foundation
      # milestone (docs/SNAPSHOT_ARCHITECTURE.md): captures POST_GAME_SETTLEMENT
      # (settlement + CLV linkage) and CLOSING_LINE (finalized closing quotes)
      # Snapshots for this date, now that settlement/CLV ledgers above have
      # had their chance to be written. Never fails the workflow -- same
      # continue-on-error convention as every other step in this file, and
      # the same non-fatal-by-design rationale as fetch-slate.yml's snapshot step.
      - name: Create immutable POST_GAME_SETTLEMENT snapshot
        run: python3 scripts/create_snapshot.py POST_GAME_SETTLEMENT "${{ env.DATE }}" --workflow-run-id "${{ github.run_id }}"
        continue-on-error: true

      - name: Create immutable CLOSING_LINE snapshot
        run: python3 scripts/create_snapshot.py CLOSING_LINE "${{ env.DATE }}" --workflow-run-id "${{ github.run_id }}"
        continue-on-error: true

      # Scored Postgame Replay milestone (docs/SCORED_REPLAY.md): scores
      # that date's already-completed forward CANDIDATE_MODEL replay
      # (data/edgelab/replay_runs/, written pregame by
      # scripts/run_forward_replay.py in fetch-slate.yml) against the
      # canonical settlement/CLV/recommendation/ModelEvaluation/bet
      # evidence the steps above just produced. Deliberately the LAST
      # step before commit, after settlement, CLV linkage (via the
      # POST_GAME_SETTLEMENT snapshot just created), and Recommendation/
      # ModelEvaluation ingestion have all had their chance to run --
      # never scores against a still-empty ledger for THIS invocation.
      # Research-only, same continue-on-error convention as every other
      # step here: scripts/score_replay.py --date never fails the
      # workflow on its own (see its own docstring) -- if upstream
      # ingestion is still incomplete for this date (e.g. a delayed
      # settlement), that is recorded as an explicit limitation reason
      # on the scored output, not a workflow failure, and a later rerun
      # of this workflow (idempotent) fills it in.
      - name: Score replay against postgame outcomes
        run: python3 scripts/score_replay.py --date "${{ env.DATE }}"
        continue-on-error: true

      - name: Commit EdgeLab postgame output (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "edgelab postgame settlement: ${{ env.DATE }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "data/edgelab/recommendations/${{ env.DATE }}.jsonl" \
            "data/edgelab/recommendations/${{ env.DATE }}.jsonl.gz" \
            "data/edgelab/model_evaluations/${{ env.DATE }}.jsonl" \
            "data/edgelab/model_evaluations/${{ env.DATE }}.jsonl.gz" \
            "data/edgelab/games/${{ env.DATE }}.jsonl" \
            "data/edgelab/settlements/${{ env.DATE }}.jsonl" \
            "data/edgelab/settlements/${{ env.DATE }}.jsonl.gz" \
            "data/edgelab/bets/bets.jsonl" \
            "data/edgelab/research_runs/${{ env.DATE }}.jsonl" \
            "data/edgelab/snapshots/${{ env.DATE }}/" \
            "data/edgelab/scored_replay_runs/" \
            "data/edgelab/scored_replay_status.json" \
            "data/edgelab/reports/scored_replay/${{ env.DATE }}.json"
