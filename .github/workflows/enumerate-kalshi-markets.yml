name: Enumerate Kalshi Markets

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD). Leave blank for today ET.'
        required: false
        default: ''
  schedule:
    - cron: '0 16 * * *'
    - cron: '30 21 * * *'
    - cron: '0 0 * * *'
    - cron: '0 2 * * *'

jobs:
  enumerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set date
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          echo "DATE=$DATE" >> $GITHUB_ENV
      - name: Build complete market index
        run: python3 scripts/build_final_index.py ${{ env.DATE }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kalshi_market_index.json data/kalshi_odds_history.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "kalshi market index $(TZ='America/New_York' date +'%Y-%m-%d %H:%M ET')" && git push
