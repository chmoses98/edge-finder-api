name: Fetch Slate Data

# Prospective/CLV Measurement Reliability mission (upstream fix for the
# 2026-08-11..15 stale-slate gap, see PR #105): this workflow previously
# had NO schedule trigger at all -- data/slate.json's daily refresh
# depended entirely on a human remembering to `workflow_dispatch` (or
# push a `.fetch-trigger` commit) every day. When that didn't happen for
# 6 days, every downstream consumer of data/slate.json (most
# consequentially model-snapshot-scheduler.yml's 15-minute prospective
# re-evaluation cycle) silently operated against a dead slate the whole
# time -- see PR #105's slate_staleness_reason() for the detection side
# of that fix; this is the upstream cause.
#
# Cron cadence (3x/day, UTC, chosen from this repo's own real operating
# history -- `git log -- data/slate.json` shows the historical manual
# dispatches nearly always landing between 12:52 ET and 20:36 ET, with
# the large majority clustered 17:00-18:48 ET once starters/pinnacle
# odds are posted, and only rare early-day-game successes before that):
#   16:00 UTC (12:00 PM ET) -- early attempt; catches day-game slates
#     whose lineups/odds are already posted (matches this repo's rare
#     early-success days).
#   20:00 UTC (4:00 PM ET) -- main attempt; lands after this repo's own
#     observed 17:00-18:48 ET success cluster with margin.
#   22:00 UTC (6:00 PM ET) -- safety retry for a starters/odds posting
#     that ran later than usual.
# A day whose starters are STILL not posted by the second retry keeps
# failing pre-validation (exit 2, snapshot-only commit, no publish) --
# same as an unattended manual-dispatch day today; not a regression.
# Never more frequent than this: unlike model-snapshot-scheduler.yml
# (CPU-only, no external calls), every run of this job makes real,
# metered network calls (the-odds-api.com, Kalshi, Baseball Savant), so
# the cadence deliberately mirrors real single-success-per-day operating
# history rather than polling aggressively.
#
# SCOPE: the schedule trigger drives ONLY slate fetch/publish (through
# "Write meta and commit authoritative slate", BLOCK 6) -- the optional
# execution/logging chain in BLOCK 7 (risk_gate.py / write_pending_bets.py
# / validate_bet_logging.py / write_tracked_tickers.py, i.e. real
# automated bet placement) is explicitly gated to `workflow_dispatch`/
# `push` only (see each step's own `if:` below) and NEVER fires on a
# `schedule` event. This is a deliberate scope decision: keeping the
# slate/research data fresh automatically is this mission's goal; turning
# on unattended live bet placement is a separate decision this change
# does not make. capture_closing_lines is unaffected (read-only price
# capture for already-open bets, not new bet placement) and continues to
# run on every trigger, matching its pre-existing condition.
#
# Manual workflow_dispatch (with or without an explicit date) and the
# push-to-.fetch-trigger path are both fully preserved, unchanged.

on:
  push:
    branches: [main, 'run/fetch-*']
    paths: ['.fetch-trigger']
  schedule:
    - cron: '0 16 * * *'   # 12:00 PM ET -- early attempt
    - cron: '0 20 * * *'   # 4:00 PM ET -- main attempt
    - cron: '0 22 * * *'   # 6:00 PM ET -- safety retry
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD). Leave blank for today ET.'
        required: false
        default: ''

# Shared with clv-update.yml and lineup-recheck.yml (Production Reliability
# and Settlement Recovery milestone, docs/POSTMORTEM_PRODUCTION_RELIABILITY_2026.md
# "Workflow concurrency" section): all three read and/or write the same
# system-of-record files (data/slate.json, data/slates/<date>/authoritative.json
# via protect_slate.py, and -- for clv-update.yml specifically -- bets.json/
# BET_LOG.md). Using ONE shared group name serializes them against EACH
# OTHER, not just against themselves, closing the race the fetch-slate.yml
# review already flagged but deferred ("clv-update.yml ... no shared
# concurrency group with fetch-slate.yml"). Deliberately NOT ref-scoped
# (${{ github.ref }}) any more: production dispatches of all three always
# target `main` in practice (confirmed via GitHub Actions run history
# during this milestone's investigation), so the small extra cost of
# serializing a hypothetical non-main manual test run too is an acceptable
# trade for a single, easy-to-reason-about lock. High-frequency, disjoint-
# path workflows (capture-snapshots-scheduled.yml, clv_capture.yml,
# capture-closing-lines.yml -- each writes only its own
# data/kalshi_registry_snapshots|clv_snapshots|clv/ subtree, never
# data/slate.json or bets.json) are deliberately NOT part of this group;
# blocking them against fetch-slate/clv-update/lineup-recheck would be
# unnecessary serialization of workflows that cannot actually race on a
# shared file.
concurrency:
  group: edge-finder-ledger-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set date
      id: set_date
      run: |
        DATE="${{ github.event.inputs.date }}"
        if [ -z "$DATE" ]; then
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" =~ ^run/fetch-([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            DATE="${BASH_REMATCH[1]}"
            echo "Date extracted from branch name: $DATE"
          else
            DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          fi
        fi
        echo "DATE=$DATE" >> $GITHUB_ENV
        echo "date=$DATE" >> $GITHUB_OUTPUT
        echo "Fetching slate for $DATE"

    # ── BLOCK 1: Vercel fetch ─────────────────────────────────────────────
    # Fetch all Vercel endpoints. These are all fast and independent.
    # slate.json is needed for pre-validation; kalshi_search.json for archive.

    - name: Fetch non-odds data from Vercel
      run: |
        mkdir -p data
        CB=$(date +%s)
        # Diagnostics fix (recurring /api/slate failure investigation): the
        # previous `curl -sf ... || { echo "ERROR: ... fetch failed"; }`
        # pattern suppresses both the HTTP status and the response body on
        # failure (-f's whole purpose) -- the log showed nothing but that
        # one line no matter what actually went wrong server-side. This
        # still fails the job loudly on any non-2xx/transport failure, but
        # first prints exactly what a human needs to diagnose it: the
        # requested URL, whether the failure was transport-level (curl
        # itself couldn't complete the request -- DNS/connect/timeout) or
        # HTTP-level (a response came back, just not 2xx), the HTTP status
        # or curl exit code, and a safely truncated response body (never
        # request headers -- no secrets are ever sent to these endpoints,
        # but this still never prints them). Retry behavior is unchanged:
        # curl's --retry retries transient/5xx statuses independent of -f,
        # so dropping -f does not weaken retries.
        fetch_endpoint() {
          local name=$1 url=$2
          echo "Fetching $name..."
          local http_code curl_exit
          http_code=$(curl -s -o "data/${name}.json" -w "%{http_code}" \
            "$url" -H "Accept: application/json" -H "Cache-Control: no-cache" \
            --retry 3 --retry-delay 5)
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            echo "ERROR: ${name} fetch failed (TRANSPORT_ERROR)"
            echo "  URL: $url"
            echo "  curl exit code: $curl_exit"
            exit 1
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "ERROR: ${name} fetch failed (HTTP_ERROR)"
            echo "  URL: $url"
            echo "  HTTP status: $http_code"
            echo "  Response body (truncated to 2000 bytes):"
            head -c 2000 "data/${name}.json" 2>/dev/null | tr -cd '[:print:]\n\t'
            echo
            exit 1
          fi
          echo "  ${name}.json $(wc -c < data/${name}.json) bytes (HTTP $http_code)"
        }
        fetch_endpoint teamstats "https://edge-finder-api.vercel.app/api/teamstats?_cb=${CB}"
        fetch_endpoint pitchers  "https://edge-finder-api.vercel.app/api/pitchers?date=${{ env.DATE }}&_cb=${CB}"
        fetch_endpoint weather   "https://edge-finder-api.vercel.app/api/weather?_cb=${CB}"
        fetch_endpoint bullpen   "https://edge-finder-api.vercel.app/api/bullpen?_cb=${CB}"
        fetch_endpoint slate     "https://edge-finder-api.vercel.app/api/slate?date=${{ env.DATE }}&_cb=${CB}"

    - name: Fetch odds
      run: |
        curl -s -o data/odds.json -H "Accept: application/json" -H "Cache-Control: no-cache" \
          --retry 3 --retry-delay 10 \
          "https://edge-finder-api.vercel.app/api/odds"
        echo "odds.json: $(wc -c < data/odds.json) bytes"
        python3 scripts/validate_odds.py

    - name: Fetch Kalshi ML markets
      run: |
        curl -sf "https://edge-finder-api.vercel.app/api/kalshi?date=${{ env.DATE }}" \
          -H "Accept: application/json" -o data/kalshi_raw.json \
          && echo "kalshi_raw.json: $(wc -c < data/kalshi_raw.json) bytes" \
          || { echo "ERROR: Kalshi ML fetch failed"; exit 1; }

    - name: Fetch Kalshi F5/TT/NRFI markets
      run: |
        curl -sf "https://edge-finder-api.vercel.app/api/kalshisearch" \
          -H "Accept: application/json" -o data/kalshi_search.json \
          && echo "kalshi_search.json: $(wc -c < data/kalshi_search.json) bytes" \
          || { echo "ERROR: Kalshi search fetch failed"; exit 1; }
        python3 scripts/preview_kalshi.py

    # ── BLOCK 2: Archive Kalshi snapshot ──────────────────────────────────
    # This runs immediately after kalshi_search.json is written.
    # It is BEFORE pre-validation and BEFORE any pipeline step that could fail.
    # A failure anywhere later in the pipeline cannot prevent this from running.
    #
    # Stale-date guard: verify the slate.json date matches $DATE before archiving.
    # If slate.json reports a different date, we skip archiving and fail clearly.

    - name: Archive Kalshi registry snapshot
      id: archive_snapshot
      run: |
        SNAP_DATE="${{ env.DATE }}"
        SNAP_DIR="data/kalshi_registry_snapshots"
        SNAP_PATH="${SNAP_DIR}/kalshi_search_${SNAP_DATE}.json"
        mkdir -p "$SNAP_DIR"

        # Stale-date guard: read the slate date and compare
        SLATE_DATE=$(python3 -c "
        import json,sys
        try:
          with open('data/slate.json') as f:
            d = json.load(f)
          print(d.get('date',''))
        except Exception as e:
          print('', end='')
        " 2>/dev/null)

        echo "Expected date: $SNAP_DATE"
        echo "Slate date:    $SLATE_DATE"

        if [ -z "$SLATE_DATE" ]; then
          echo "WARNING: Could not read slate.json date — archiving anyway (kalshi_search is date-independent)"
          cp data/kalshi_search.json "$SNAP_PATH"
          echo "snapshot_archived=true"   >> $GITHUB_OUTPUT
          echo "snapshot_path=$SNAP_PATH" >> $GITHUB_OUTPUT
          echo "snapshot_date=$SNAP_DATE" >> $GITHUB_OUTPUT
          echo "Archived: $SNAP_PATH ($(wc -c < "$SNAP_PATH") bytes)"
        elif [ "$SLATE_DATE" != "$SNAP_DATE" ]; then
          echo "STALE DATA GUARD: slate.json date=$SLATE_DATE does not match expected=$SNAP_DATE"
          echo "Refusing to archive snapshot to prevent stale date contamination."
          echo "snapshot_archived=false" >> $GITHUB_OUTPUT
          echo "snapshot_date=$SLATE_DATE" >> $GITHUB_OUTPUT
          echo "snapshot_stale=true"      >> $GITHUB_OUTPUT
          # Do NOT exit 1 — let pre-validation catch and explain this
        else
          cp data/kalshi_search.json "$SNAP_PATH"
          echo "snapshot_archived=true"   >> $GITHUB_OUTPUT
          echo "snapshot_path=$SNAP_PATH" >> $GITHUB_OUTPUT
          echo "snapshot_date=$SNAP_DATE" >> $GITHUB_OUTPUT
          echo "snapshot_stale=false"     >> $GITHUB_OUTPUT
          echo "Archived: $SNAP_PATH ($(wc -c < "$SNAP_PATH") bytes)"
        fi

    # ── BLOCK 2b: Commit snapshot immediately ─────────────────────────────
    # Pattern for every commit block in this workflow: hand the exact
    # target paths + commit message to scripts/ci/git_data_commit.py,
    # which does its own fetch/rebase(--autostash)/add/commit/push --
    # never trusting `git rebase`'s exit code for a conflicted autostash
    # pop (see that script's module docstring). Never run
    # `git pull --rebase` after a commit — that's what caused the
    # "unstaged changes" error in run #187.

    - name: Commit Kalshi snapshot (always runs)
      if: always() && steps.archive_snapshot.outputs.snapshot_archived == 'true'
      continue-on-error: true
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        python3 scripts/ci/git_data_commit.py \
          --message "kalshi snapshot ${{ env.DATE }} $(date -u +'%H:%M UTC')" \
          data/kalshi_registry_snapshots/ \
          || echo "DATA-HEALTH WARNING: Kalshi snapshot push failed."

    # ── BLOCK 3: Pre-validation ───────────────────────────────────────────
    # Checks starters + pinnacleVF — the fields the Vercel API populates.
    # Exit 0 = ok, proceed with full pipeline.
    # Exit 2 = not ready (starters not posted); commit snapshot-only, stop.
    # Exit 1 = hard fail (wrong date / no games).

    - name: Pre-validate slate (starters + pinnacle)
      id: pre_validate
      run: |
        python3 scripts/validate_slate_pre.py "${{ env.DATE }}"
        PRE_STATUS=$?
        echo "pre_exit=$PRE_STATUS" >> $GITHUB_OUTPUT
        exit $PRE_STATUS
      continue-on-error: true

    # ── BLOCK 3b: Commit snapshot-only if not-ready ───────────────────────

    - name: Commit snapshot-only (not-ready path)
      if: steps.pre_validate.outputs.pre_exit == '2' && steps.archive_snapshot.outputs.snapshot_archived == 'true'
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        python3 scripts/ci/git_data_commit.py \
          --message "kalshi snapshot ${{ env.DATE }} (starters not yet posted)" \
          data/kalshi_registry_snapshots/
        echo "Snapshot committed. Stopping pipeline — re-run after starters post (~3pm ET)."

    - name: Fail if pre-validation not-ready
      if: steps.pre_validate.outputs.pre_exit == '2'
      run: |
        echo "PRE-VALIDATION: slate not ready for ${{ env.DATE }} — starters/pinnacle not posted yet."
        echo "Kalshi snapshot was $([ '${{ steps.archive_snapshot.outputs.snapshot_archived }}' = 'true' ] && echo 'archived' || echo 'NOT archived')."
        exit 1

    - name: Fail if pre-validation hard-failed
      if: steps.pre_validate.outputs.pre_exit == '1'
      run: |
        echo "PRE-VALIDATION HARD FAIL — wrong date or no games. See above for details."
        exit 1

    # ── BLOCK 4: Full data pipeline ───────────────────────────────────────
    # Only runs when pre-validation passed (exit 0).

    - name: Fetch Savant data (team wOBA, batter wOBA, pitcher fbPct)
      run: python3 scripts/fetch_savant_team.py

    - name: Fetch high-leverage bullpen xFIP splits
      run: python3 scripts/fetch_savant_bullpen_hl.py

    - name: Fetch recent bullpen usage (availability/fatigue context)
      run: python3 scripts/fetch_bullpen_usage.py

    - name: Fetch TTO splits, fbPct, and velocity trends for today's starters
      run: python3 scripts/fetch_savant_pitchers.py

    - name: Fetch confirmed lineups and compute lineup wOBA delta
      run: python3 scripts/fetch_lineups.py

    - name: Fetch confirmed-lineup batter platoon splits (vs LHP/RHP)
      run: python3 scripts/fetch_batter_platoon_splits.py

    - name: Enrich game-level lineup confirmation field
      run: python3 scripts/enrich_lineup_confirmed.py

    - name: Post-fetch data quality gate
      run: python3 scripts/post_fetch_gate.py "${{ env.DATE }}"

    # ── Commit fetch_status.json (always) ─────────────────────────────────
    # Gate writes data/fetch_status.json before exiting (pass or fail).
    # fetch+rebase --autostash handles dirty working tree (all the data/
    # files modified by the pipeline are not staged and would block a plain
    # git rebase).  Only fetch_status.json is staged and committed here.

    - name: Commit fetch_status.json (always — captures gate result for debugging)
      if: always()
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        python3 scripts/ci/git_data_commit.py \
          --message "fetch_status: ${{ env.DATE }} gate result" \
          data/fetch_status.json

    - name: Write preliminary meta.json (so validator sees correct date mid-pipeline)
      run: |
        printf '{"date":"%s","status":"in_progress"}' \
          "${{ env.DATE }}" > data/meta.json
        echo "Preliminary meta.json written for ${{ env.DATE }}"

    - name: Enumerate all Kalshi markets (events + nested markets)
      continue-on-error: true
      run: |
        python3 scripts/fetch_kalshi_markets.py ${{ env.DATE }} || true
        echo "kalshi_market_index.json: $(wc -c < data/kalshi_market_index.json 2>/dev/null || echo 'not created')"

    - name: Build Kalshi market registry
      run: |
        python3 scripts/build_kalshi_registry.py ${{ env.DATE }}
        echo "kalshi_market_registry.json: $(wc -c < data/kalshi_market_registry.json 2>/dev/null || echo 'not created') bytes"

    - name: Validate current slate date (stale-data guard)
      run: python3 scripts/validate_current_slate_date.py "${{ env.DATE }}"

    - name: Fetch opponent quality (rolling 15-game starter xFIP per team)
      run: python3 scripts/fetch_opp_quality.py

    - name: Regression test — F5 parse_suffix (guards 2026-06-08 backfill bug)
      run: python3 scripts/test_f5_parse_suffix.py

    # ── Production provenance capture (Forward Replay Corpus and Production
    # Provenance milestone) ──────────────────────────────────────────────
    # Deliberately positioned HERE, not at job start (maintainer review of
    # PR #37, item 1: "confirm captured after checkout but before production
    # execution; cannot accidentally capture snapshot-writer/later-ingestion
    # commit"). This job commits to `main` and rebases onto origin/main THREE
    # times before this point (Commit Kalshi snapshot, the not-ready-path
    # snapshot commit, and Commit fetch_status.json) -- each `git rebase
    # --autostash origin/main` updates the local working tree/HEAD if
    # anything else pushed to main in the meantime. Capturing provenance at
    # job start (the original design) could therefore record a commit SHA
    # that a concurrent push+rebase silently moved past before the actual
    # model-execution chain (merge_odds.py onward, below) ran -- misidentifying
    # the code that produced the recommendations.
    #
    # This position is the earliest point after which NO further git
    # rebase/commit happens before scripts/build_market_ledger.py executes
    # (verified by inspecting every step between here and "Build complete
    # market evaluation ledger": Enrich data and Build complete market
    # evaluation ledger perform no git operations), so it is the latest
    # possible capture point that still runs strictly before production
    # model execution -- closing the drift window without introducing a new
    # one on the other side.
    #
    # Never touches data/slate.json, bets.json, or any production file --
    # purely additive provenance capture. Uses continue-on-error, same
    # policy as the PRE_GAME_DECISION snapshot step later in this job (see
    # scripts/create_snapshot.py's "WORKFLOW FAILURE POLICY" docstring):
    # this capture infrastructure must never be able to block production
    # slate publication or betting behavior. A missing/failed/ambiguous
    # capture here surfaces later as a downgraded snapshot completeness
    # status (MISSING_REQUIRED_INPUT / PARTIAL_REPLAY), never a silent gap
    # and never a production outage.
    - name: Record production provenance (commit SHA, workflow run, ref)
      continue-on-error: true
      run: python3 scripts/capture_production_provenance.py "${{ env.DATE }}"

    - name: Merge all odds into slate
      run: python3 scripts/merge_odds.py

    - name: Enrich data
      run: python3 scripts/enrich_data.py

    - name: Build complete market evaluation ledger
      run: python3 scripts/build_market_ledger.py

    - name: Generate F5 audit artifact
      run: |
        python3 scripts/generate_f5_audit.py "${{ env.DATE }}" || true
        echo "F5 audit: $(ls -lh data/f5_audit_*.csv 2>/dev/null || echo 'no file written')"

    # Stage 1 pre-gate full-market projection board (game-derived MLB
    # markets): runs after marketLedger exists (advisory linkage needs
    # it) and after data/kalshi_search.json was fetched earlier in this
    # job. Purely additive analysis output -- writes only
    # data/pipeline/<date>/projection_board.json (lib/pipeline_artifacts.py),
    # never data/slate.json/bets.json/config/rules.json. continue-on-error
    # so this analysis-only artifact can never block slate publication or
    # betting behavior, same policy as the F5 audit step above.
    - name: Build pre-gate projection board (game-derived markets)
      continue-on-error: true
      run: python3 scripts/build_projection_board.py "${{ env.DATE }}"

    - name: Regression test — ledger completeness
      run: python3 scripts/regression_test.py

    # ── BLOCK 5: Final validation ─────────────────────────────────────────
    # Runs after all pipeline steps. Checks the full slate.
    # Failure here means the pipeline produced bad output — do not commit.

    - name: Final validate slate (full readiness check)
      id: final_validate
      run: python3 scripts/validate_slate_final.py "${{ env.DATE }}" 2>&1

    - name: Apply slate protection (sentinel check + authoritative file routing)
      id: protect_slate
      run: |
        # Wire slate_manager protection:
        #   - Rejects runs with sentinel prices (quarantined as rejected_contaminated_*.json)
        #   - First run → writes official_<ts>.json + authoritative.json
        #   - Reruns   → writes recheck_<ts>.json, does NOT overwrite authoritative.json
        #   - data/slate.json is updated to match authoritative.json (backwards compat)
        # Post-slate review MUST read data/slates/$DATE/authoritative.json, not data/slate.json
        python3 scripts/protect_slate.py "${{ env.DATE }}"

    # ── BLOCK 6: Publish authoritative slate + metadata (REQUIRED) ─────────
    # This IS the authoritative pregame publication (Workflow C). It runs and
    # commits immediately after the slate itself is validated and protected —
    # BEFORE the execution/logging chain below (Workflow D). A failure in
    # Workflow D (risk gate, bet logging, CLV capture) must never leave
    # meta.json / data/slate.json pointing at a stale prior day while
    # fetch_status.json (committed earlier, unconditionally) reports success.
    #
    # This is the fix for the 2026-07-25/07-26 incident: validate_bet_logging.py
    # hard-failed on live/final games that write_pending_bets.py had correctly
    # excluded, which killed the job before this step ever ran, leaving
    # meta.json stale for days while fetch_status.json looked fine.
    - name: Write meta and commit authoritative slate
      id: publish_slate
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        printf '{"fetchedAt":"%s","date":"%s","status":"ok","oddsSource":"the-odds-api-via-vercel"}' \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ env.DATE }}" > data/meta.json
        ls -lh data/
        python3 scripts/ci/git_data_commit.py \
          --message "slate data ${{ env.DATE }} $(TZ='America/New_York' date +'%H:%M ET')" \
          data/

    # ── BLOCK 7: Execution / logging chain (OPTIONAL — Workflow D) ─────────
    # Every step below may fail without invalidating the slate already
    # published above (that's what continue-on-error is for: it keeps the
    # job from failing outright, so later steps and the final stage-status
    # commit still run).
    #
    # continue-on-error alone is NOT enough, though: GitHub Actions only
    # auto-skips a step when a *prior* step actually failed the job. Once a
    # step's failure is masked by continue-on-error, the job is never in a
    # "failing" state, so every later step in the file would still run by
    # default — even ones whose inputs depend on the failed step having
    # succeeded. That is the exact gap flagged in review: risk_gate.py
    # mutates data/slate.json in place (TT downgrades, portfolio decision);
    # if it fails/crashes, write_pending_bets.py must not read that
    # not-yet-downgraded slate.json and log a bet risk_gate would have
    # blocked. So each step below adds an explicit `if:` gate on the actual
    # outcome of the step(s) whose output it depends on. A skipped step
    # reports outcome "skipped" in pipeline_status.json (see BLOCK 8),
    # distinct from both "success" and "failure".
    #
    # Dependency graph adopted (derived from each script's actual reads/writes,
    # not assumed):
    #   risk_gate              — reads/mutates data/slate.json written by publish_slate.
    #                            No dependency other than publish_slate having run.
    #   write_pending_bets     — reads data/slate.json AFTER risk_gate's in-place
    #                            mutation (TT downgrades). Must not run on a slate
    #                            risk_gate failed to produce.
    #   validate_bet_logging   — reads bets.json AFTER write_pending_bets wrote it.
    #                            A "missing bet" comparison against a bets.json that
    #                            write_pending_bets never finished writing is not a
    #                            valid check — skip rather than false-fail or false-pass.
    #   write_tracked_tickers  — reads data/slate.json's marketLedger directly (not
    #                            bets.json), but its purpose is to register CLV
    #                            tracking for bets that were actually logged and
    #                            confirmed consistent with the ledger — so it requires
    #                            BOTH write_pending_bets and validate_bet_logging to
    #                            have succeeded, per the review's explicit guidance.
    #   capture_closing_lines  — reads ONLY data/kalshi_market_registry.json (built
    #                            earlier, in the REQUIRED section of this job, long
    #                            before risk_gate/bet-logging run) and snapshots
    #                            live prices for every registered market — including
    #                            games with no bet at all today. It does not read
    #                            bets.json or tracked_tickers.json in snapshot mode.
    #                            It is therefore INDEPENDENT of the risk_gate →
    #                            write_pending_bets → validate_bet_logging →
    #                            write_tracked_tickers chain and only needs
    #                            publish_slate to have run.
    #
    # SCOPE (Prospective/CLV Measurement Reliability mission): each of the
    # four steps below now also requires `github.event_name != 'schedule'`
    # -- automated bet placement stays a `workflow_dispatch`/`push`-only
    # action; the new scheduled slate-refresh trigger (see this file's own
    # top-of-file comment) must never place a bet on its own. This is
    # additive to each step's existing prerequisite condition, never a
    # replacement of it -- a manually dispatched run behaves identically
    # to before this change.

    - name: Risk gate (TT safety + portfolio concentration)
      id: risk_gate
      if: github.event_name != 'schedule' && steps.publish_slate.outcome == 'success'
      continue-on-error: true
      run: python3 scripts/risk_gate.py

    - name: Write pending bets to bets.json
      id: write_pending_bets
      if: github.event_name != 'schedule' && steps.risk_gate.outcome == 'success'
      continue-on-error: true
      run: python3 scripts/write_pending_bets.py

    # NOTE: this is a hard gate for the EXECUTION chain only — it fails this
    # step (and, transitively via the `if:` below, skips write_tracked_tickers)
    # if bets.json doesn't match the marketLedger. It has no bearing on
    # authoritative slate publication, which already completed above.
    - name: Validate bet logging (hard gate for execution chain — does not affect slate publication)
      id: validate_bet_logging
      if: github.event_name != 'schedule' && steps.write_pending_bets.outcome == 'success'
      continue-on-error: true
      run: python3 scripts/validate_bet_logging.py

    - name: Write tracked tickers for CLV capture
      id: write_tracked_tickers
      if: >-
        github.event_name != 'schedule' &&
        steps.write_pending_bets.outcome == 'success' &&
        steps.validate_bet_logging.outcome == 'success'
      continue-on-error: true
      run: python3 scripts/write_tracked_tickers.py --warn-only

    # Independent of the bet-logging chain above — see dependency-graph note.
    - name: Capture Kalshi closing lines for open bets
      id: capture_closing_lines
      if: steps.publish_slate.outcome == 'success'
      continue-on-error: true
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: python3 scripts/capture_closing_lines.py snapshot "${{ env.DATE }}"

    # ── BLOCK 8: Stage status + execution artifacts (always runs) ──────────
    # Writes the machine-readable stage-status artifact and commits whatever
    # the execution/logging chain produced (bets.json, tracked tickers, CLV
    # snapshots). Runs unconditionally so a failure anywhere above is still
    # visible and the already-published slate is never silently left without
    # a record of what happened downstream.
    #
    # Reviewed for staleness/overwrite/race risk (pre-merge hardening pass):
    #   - Cannot overwrite data/slates/<date>/authoritative.json with a stale
    #     working-tree copy: the only writer of that file is protect_slate.py,
    #     which already ran and committed before this step; nothing in BLOCK 7
    #     touches it, so `git add data/` produces no diff for it here.
    #   - data/slate.json DOES pick up a diff here — risk_gate.py and
    #     write_pending_bets.py mutate it in place (TT downgrades, executionSlip)
    #     after publish_slate committed it. That's intentional, not staleness:
    #     it is a newer state layered on top of the published version, not a
    #     reversion to an older one.
    #   - `git rebase --autostash` stashes/pops this step's own working-tree
    #     changes around a rebase onto latest origin/main, so it does not
    #     discard or duplicate anything this run produced.
    #   - Same-workflow concurrency is already handled by this file's
    #     `concurrency: group: fetch-slate-${{ github.ref }}` (queued, not
    #     parallel) — two fetch-slate.yml runs for the same ref cannot race.
    #   - REMAINING RISK (pre-existing, not introduced or fixed by this change):
    #     clv-update.yml (schedule: daily 06:00 UTC, plus workflow_dispatch) also
    #     commits directly to bets.json, with no shared concurrency group with
    #     fetch-slate.yml. If both workflows push conflicting bets.json changes
    #     at the same time, `git rebase --autostash` here could fail to
    #     cleanly re-apply the stash and this step would fail (visibly — not
    #     silently) rather than corrupt data. capture-snapshots-scheduled.yml
    #     and clv_capture.yml touch disjoint paths
    #     (data/kalshi_registry_snapshots/, data/clv_snapshots/) and do not
    #     share files with this job, so they present no comparable risk. Fixing
    #     the bets.json cross-workflow race would need a shared lock or
    #     migrating bets.json off of git-as-a-database — out of scope for this
    #     hardening pass; flagged for a future phase rather than addressed here
    #     without evidence of it having actually caused a lost write.
    - name: Write pipeline stage-status and commit execution artifacts
      if: always()
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        jq -n \
          --arg runId "${{ github.run_id }}" \
          --arg slateDate "${{ env.DATE }}" \
          --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg validate "${{ steps.final_validate.outcome }}" \
          --arg protect "${{ steps.protect_slate.outcome }}" \
          --arg publish "${{ steps.publish_slate.outcome }}" \
          --arg riskGate "${{ steps.risk_gate.outcome }}" \
          --arg writePendingBets "${{ steps.write_pending_bets.outcome }}" \
          --arg validateBetLogging "${{ steps.validate_bet_logging.outcome }}" \
          --arg writeTrackedTickers "${{ steps.write_tracked_tickers.outcome }}" \
          --arg captureClosingLines "${{ steps.capture_closing_lines.outcome }}" \
          '{
            runId: $runId,
            slateDate: $slateDate,
            completedAt: $completedAt,
            status: (
              if $publish != "success" then "failed"
              elif ([$riskGate, $writePendingBets, $validateBetLogging,
                     $writeTrackedTickers, $captureClosingLines]
                    | map(select(. != "success")) | length) > 0 then "partial"
              else "success" end
            ),
            stages: {
              validate:              { status: $validate },
              protect:               { status: $protect },
              publish:               { status: $publish },
              risk_gate:             { status: $riskGate },
              write_pending_bets:    { status: $writePendingBets },
              validate_bet_logging:  { status: $validateBetLogging },
              write_tracked_tickers: { status: $writeTrackedTickers },
              capture_closing_lines: { status: $captureClosingLines }
            }
          }' > data/pipeline_status.json
        cat data/pipeline_status.json

        python3 scripts/ci/git_data_commit.py \
          --message "pipeline status + execution artifacts ${{ env.DATE }}" \
          data/ bets.json

    # ── BLOCK 9: Immutable Snapshot capture (Historical Capture Completeness
    # and Immutable Snapshot Foundation milestone) ─────────────────────────
    # Runs LAST, after every production artifact this run could possibly
    # produce already exists (or has definitively failed to). Captures a
    # PRE_GAME_DECISION Snapshot manifest for today's slate -- see
    # docs/SNAPSHOT_ARCHITECTURE.md. This is new, additive, read-only-of-
    # production capture infrastructure: it must NEVER be able to fail the
    # overall workflow or block production betting/handicapping, so its
    # step uses continue-on-error and its own script never touches
    # data/slate.json, bets.json, or any production file -- only new files
    # under data/edgelab/snapshots/. A failed/incomplete capture is
    # reported as a visible warning in the job summary (see
    # scripts/create_snapshot.py), never a silent gap and never a hard
    # workflow failure -- the safest behavior for infrastructure this new,
    # per this milestone's explicit "choose the safest behavior and
    # document it" instruction.
    - name: Create immutable PRE_GAME_DECISION snapshot
      id: create_snapshot
      if: always()
      continue-on-error: true
      run: python3 scripts/create_snapshot.py PRE_GAME_DECISION "${{ env.DATE }}" --workflow-run-id "${{ github.run_id }}"

    # ── BLOCK 10: Automatic forward candidate replay (Forward Replay
    # Corpus and Production Provenance milestone) ──────────────────────────
    # Runs immediately after snapshot capture, against the snapshot just
    # created (reads it from the local filesystem -- does not need it
    # committed to git first). Research-only: CANDIDATE_MODEL mode,
    # verifies all hashes before executing (lib.edgelab.replay's own
    # eligibility check), writes only under data/edgelab/replay_runs/,
    # never touches data/slate.json/bets.json/config/rules.json. Same
    # continue-on-error policy as snapshot capture itself -- see
    # scripts/run_forward_replay.py's own module docstring. If no
    # snapshot exists (capture failed above), this step honestly records
    # "no_snapshot" and exits 0 without attempting a replay.
    - name: Run automatic forward candidate replay (research-only)
      id: forward_replay
      if: always()
      continue-on-error: true
      run: python3 scripts/run_forward_replay.py "${{ env.DATE }}" --workflow-run-id "${{ github.run_id }}"

    - name: Commit snapshot and replay artifacts (only if changed)
      if: always()
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        python3 scripts/ci/git_data_commit.py \
          --message "snapshot + forward replay: PRE_GAME_DECISION ${{ env.DATE }} $(date -u +'%H:%M UTC')" \
          "data/edgelab/snapshots/${{ env.DATE }}/" \
          "data/edgelab/replay_runs/" "data/edgelab/forward_replay_status.json" \
          || echo "DATA-HEALTH WARNING: snapshot/replay push failed."
