name: Fetch Slate Data

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD). Leave blank for today ET.'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch slate data
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          fi
          echo "Fetching slate for $DATE"
          mkdir -p data

          fetch_endpoint() {
            local name=$1
            local url=$2
            echo "Fetching $name..."
            curl -sf "$url" -H "Accept: application/json" --retry 3 --retry-delay 5               -o "data/${name}.json"               || echo "{"error":"${name} fetch failed","date":"$DATE"}" > "data/${name}.json"
          }

          fetch_endpoint "slate"     "https://edge-finder-api.vercel.app/api/slate?date=$DATE"
          fetch_endpoint "pitchers"  "https://edge-finder-api.vercel.app/api/pitchers?date=$DATE"
          fetch_endpoint "teamstats" "https://edge-finder-api.vercel.app/api/teamstats"
          fetch_endpoint "weather"   "https://edge-finder-api.vercel.app/api/weather"
          fetch_endpoint "bullpen"   "https://edge-finder-api.vercel.app/api/bullpen"

          printf '{"fetchedAt":"%s","date":"%s","status":"ok"}'             "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$DATE" > data/meta.json

          echo "Files written:"
          ls -lh data/

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" ||             git commit -m "slate data $(TZ='America/New_York' date +'%Y-%m-%d %H:%M ET')" && git push
