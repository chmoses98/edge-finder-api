name: Fetch Slate Data

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD). Leave blank for today ET.'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch slate data
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          fi
          echo "Fetching slate for $DATE"
          mkdir -p data

          fetch_endpoint() {
            local name=$1
            local url=$2
            echo "Fetching $name..."
            curl -sf "$url" -H "Accept: application/json" --retry 3 --retry-delay 5 \
              -o "data/${name}.json" \
              || echo "{\"error\":\"${name} fetch failed\",\"date\":\"$DATE\"}" > "data/${name}.json"
          }

          # Fetch teamstats FIRST — slate.js reads from it via raw GitHub
          fetch_endpoint "teamstats" "https://edge-finder-api.vercel.app/api/teamstats"
          fetch_endpoint "slate"     "https://edge-finder-api.vercel.app/api/slate?date=$DATE"
          fetch_endpoint "pitchers"  "https://edge-finder-api.vercel.app/api/pitchers?date=$DATE"
          fetch_endpoint "weather"   "https://edge-finder-api.vercel.app/api/weather"
          fetch_endpoint "bullpen"   "https://edge-finder-api.vercel.app/api/bullpen"

          printf '{"fetchedAt":"%s","date":"%s","status":"ok"}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$DATE" > data/meta.json

          echo "Files written:"
          ls -lh data/

      - name: Enrich data with computed fields
        run: |
          python3 << 'PYEOF'
          import json, math, sys

          import json

          LEAGUE_AVG_RPG = 4.5  # 2026 MLB baseline — update each season

          # ── 1. Load both data files ──────────────────────────────────────────
          try:
              with open('data/teamstats.json') as f:
                  ts = json.load(f)
              with open('data/slate.json') as f:
                  slate = json.load(f)
          except Exception as e:
              print(f"Failed to load data files: {e}")
              exit(0)

          ts_teams = ts.get('teams', {})

          # ── 2. Compute wrcPlus from R/G in teamstats record data ─────────────
          # wrcPlus proxy = (team season R/G / league avg R/G) × 100
          # Accurate within ~8-10 points; sufficient for offense scalar
          for abbr, t in ts_teams.items():
              rec = t.get('record', {})
              rs  = rec.get('runsScored', 0) or 0
              wins   = rec.get('wins', 0) or 0
              losses = rec.get('losses', 0) or 0
              gp = wins + losses
              if gp > 0 and rs > 0:
                  rpg = rs / gp
                  t['wrcPlus']    = round(rpg / LEAGUE_AVG_RPG * 100)
                  t['runsPerGame'] = round(rpg, 2)
              else:
                  t['wrcPlus']    = 100
                  t['runsPerGame'] = None

          ts['wrcSource'] = 'rpg_proxy'
          ts['lgRpG']     = LEAGUE_AVG_RPG

          with open('data/teamstats.json', 'w') as f:
              json.dump(ts, f)

          print(f"teamstats.json: wrcPlus computed for {len(ts_teams)} teams via R/G proxy")
          for abbr in ['NYY', 'LAD', 'COL', 'KC']:
              t = ts_teams.get(abbr, {})
              print(f"  {abbr}: wrcPlus={t.get('wrcPlus')} rpg={t.get('runsPerGame')} last7={t.get('last7RpG')} last15={t.get('last15RpG')}")

          # ── 3. Inject wrcPlus + rolling R/G + runsPerGame into slate.json ────
          enriched = 0
          for game in slate.get('games', []):
              for side_key, abbr_key in [('awayTeamStats','away'), ('homeTeamStats','home')]:
                  abbr = game.get(abbr_key, {}).get('abbr')
                  if not abbr or abbr not in ts_teams:
                      continue
                  td = ts_teams[abbr]
                  stats = game.get(side_key)
                  if stats is None:
                      stats = {}
                      game[side_key] = stats
                  stats['wrcPlus']    = td.get('wrcPlus')
                  stats['last7RpG']   = td.get('last7RpG')
                  stats['last15RpG']  = td.get('last15RpG')
                  stats['runsPerGame'] = td.get('runsPerGame')
                  enriched += 1

          with open('data/slate.json', 'w') as f:
              json.dump(slate, f)
          print(f"slate.json: {enriched} team stat blocks enriched")

          if slate.get('games'):
              g = slate['games'][0]
              ats = g.get('awayTeamStats', {})
              print(f"  Check [{g.get('away',{}).get('abbr')}@{g.get('home',{}).get('abbr')}]: "
                    f"wrcPlus={ats.get('wrcPlus')} last7={ats.get('last7RpG')} last15={ats.get('last15RpG')} rpg={ats.get('runsPerGame')}")

          PYEOF

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "slate data $(TZ='America/New_York' date +'%Y-%m-%d %H:%M ET')" && git push
