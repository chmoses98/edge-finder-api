name: Kalshi Price Check (Standalone)

# Standalone Kalshi MLB price-check tool. Manually retrieves,
# normalizes, filters, and displays current Kalshi MLB market prices
# WITHOUT running the slate, projection, recommendation, risk,
# execution, or settlement pipeline. This is a pricing and discovery
# tool only -- see docs/KALSHI_PRICE_CHECKER.md.
#
# This workflow NEVER invokes scripts/build_market_ledger.py,
# scripts/risk_gate.py, scripts/write_pending_bets.py,
# scripts/protect_slate.py, scripts/validate_slate_final.py, or any
# other production pipeline step. The tool's own display/filtering
# results (kalshi_price_check.json/.csv) are NEVER committed -- they
# remain upload-artifact-only, exactly as before.
#
# Market Research Corpus milestone: this workflow ALSO archives an
# unfiltered complete-market capture into the shared EdgeLab research
# corpus on every successful run, so the user's display filters never
# limit what's available for later research -- see the "Archive"/
# "Ingest"/"Commit" steps at the end of this job. That capture makes its
# OWN independent live fetch of the same endpoint (identical to "Capture
# Kalshi Snapshots (Scheduled)"'s own step) rather than reusing anything
# from scripts/check_kalshi_prices.py, so the price-check tool's
# pure/network-isolated core (lib/kalshi_price_check.py) is completely
# unaffected -- see tests/test_check_kalshi_prices_safety_isolation.py,
# still green. Only data/kalshi_registry_snapshots/ (raw) and
# data/edgelab/ (normalized corpus) are ever written to the repository by
# this workflow; it still makes no recommendations and places no wagers.

# NOTE ON INPUT COUNT: GitHub Actions hard-caps workflow_dispatch at a
# maximum of 10 top-level inputs (exceeding it produces the API/UI
# error "you may only define up to 10 inputs for a workflow_dispatch
# event"). This workflow previously defined 15 inputs, which is why
# the "Run workflow" form behaved erratically (editing one field, e.g.
# max_results, would revert other fields to their defaults) -- that
# was the direct, predictable symptom of exceeding this platform
# limit, not a random UI bug. The 6 least-used filters (date, outcome,
# participant, ticker, event_ticker, series_ticker) are now
# consolidated into a single `advanced_filters_json` input (parsed by
# scripts/parse_advanced_filters.py) to stay within the limit while
# keeping every filter this tool supports still reachable. See
# docs/KALSHI_PRICE_CHECKER.md for the full investigation and the
# advanced_filters_json JSON schema.
#
# Standalone usability mission: selected-game filtering (`games`, a
# comma-separated list of EXACT AWAY@HOME matchups -- never a substring
# match) and not-started-only filtering (`exclude_started`, using the
# same POST_START checkpoint logic lib.edgelab.market_universe already
# uses to determine "has first pitch happened") were added the same
# way -- inside advanced_filters_json, since this workflow is already
# at the 10-input limit. These affect ONLY this run's own display
# output (kalshi_price_check.json/.csv/table/summary) -- the unfiltered
# research-corpus archive step near the bottom of this file makes its
# own independent, unfiltered fetch regardless of any display filter,
# exactly as it already did before this change.
#
# ARTIFACT-USABILITY INVESTIGATION: the primary JSON/CSV outputs are
# delivered via actions/upload-artifact, which GitHub Actions always
# packages as a ZIP on download -- confirmed inherent platform
# behavior, not something this workflow can opt out of, so this does
# not attempt to fight it. Instead, the exact same kalshi_price_check.json
# is now ALSO embedded directly in the job summary/log as a collapsible
# raw-JSON block (see the "Embed raw JSON" step below), a zero-download
# path alongside the pre-existing mobile Markdown table -- no artifact
# extraction required to read or copy the result.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Data source mode: live, snapshot, or auto."
        required: false
        default: "auto"
      team:
        description: "Team filter (matches away or home)."
        required: false
        default: ""
      game:
        description: "Matchup substring filter, e.g. 'Yankees vs Red Sox'."
        required: false
        default: ""
      scope:
        description: "Horizon scope filter (e.g. F3, F5, F7, full_game)."
        required: false
        default: ""
      family:
        description: "Market family filter (e.g. inning_result, game_result, team_total)."
        required: false
        default: ""
      include_unknown:
        description: "Include unrecognized/unsupported markets."
        required: false
        type: boolean
        default: true
      include_closed:
        description: "Include closed markets."
        required: false
        type: boolean
        default: false
      max_results:
        description: "Maximum result count."
        required: false
        default: "250"
      advanced_filters_json:
        description: >-
          Optional JSON object for the less-common filters, e.g.
          {"date":"2026-07-30","ticker":"KXMLBF5-...","outcome":"Tie"}
          or {"games":"PIT@CIN,NYY@BOS","exclude_started":true}.
          Allowed keys: date, outcome, participant, ticker,
          event_ticker, series_ticker, games (comma-separated exact
          AWAY@HOME matchups), exclude_started (boolean -- excludes
          games whose scheduled start has already passed). Leave blank
          for none.
        required: false
        default: ""
      archive_snapshot:
        description: "Also produce an archive-ready artifact bundle (does NOT commit to the repository)."
        required: false
        type: boolean
        default: false

permissions:
  # Was `contents: read` -- widened to `write` solely so this workflow can
  # commit the Market Research Corpus milestone's archive steps below
  # (data/kalshi_registry_snapshots/ + data/edgelab/ only). The tool's own
  # display/filtering behavior and its non-commit of
  # kalshi_price_check.json/.csv are unchanged.
  contents: write

concurrency:
  # Shares a concurrency group with edgelab-capture.yml (the scheduled
  # corpus writer) so the two never race writing data/edgelab/ at the
  # same time -- see lib/edgelab/storage.py's locked()/append_records for
  # the same-host half of this guarantee; this is the cross-workflow half.
  group: edgelab-capture
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No third-party dependencies -- the tool uses only the Python
      # standard library plus this repository's own lib/ modules,
      # already present after checkout.

      - name: Run standalone Kalshi price-check tool
        id: price_check
        env:
          IN_SOURCE: ${{ inputs.source }}
          IN_TEAM: ${{ inputs.team }}
          IN_GAME: ${{ inputs.game }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_FAMILY: ${{ inputs.family }}
          IN_INCLUDE_CLOSED: ${{ inputs.include_closed }}
          IN_INCLUDE_UNKNOWN: ${{ inputs.include_unknown }}
          IN_MAX_RESULTS: ${{ inputs.max_results }}
          IN_ADVANCED_FILTERS_JSON: ${{ inputs.advanced_filters_json }}
        run: |
          ARGS=(--source "$IN_SOURCE" --format json \
                --output kalshi_price_check_result.json \
                --metadata-output kalshi_price_check_metadata.json \
                --verbose)
          [ -n "$IN_TEAM" ] && ARGS+=(--team "$IN_TEAM")
          [ -n "$IN_GAME" ] && ARGS+=(--game "$IN_GAME")
          [ -n "$IN_SCOPE" ] && ARGS+=(--scope "$IN_SCOPE")
          [ -n "$IN_FAMILY" ] && ARGS+=(--family "$IN_FAMILY")
          [ "$IN_INCLUDE_CLOSED" = "true" ] && ARGS+=(--include-closed)
          [ "$IN_INCLUDE_UNKNOWN" = "false" ] && ARGS+=(--exclude-unknown)
          [ -n "$IN_MAX_RESULTS" ] && ARGS+=(--max-results "$IN_MAX_RESULTS")

          # The 6 rare filters (date/outcome/participant/ticker/
          # event_ticker/series_ticker) arrive consolidated in a single
          # JSON input -- see the note above workflow_dispatch.inputs.
          # A malformed or unrecognized advanced_filters_json fails the
          # run loudly here rather than silently ignoring part of it.
          if ! ADV_ARGS=$(python3 scripts/parse_advanced_filters.py "$IN_ADVANCED_FILTERS_JSON"); then
            exit 1
          fi
          if [ -n "$ADV_ARGS" ]; then
            while IFS= read -r arg; do
              ARGS+=("$arg")
            done <<< "$ADV_ARGS"
          fi

          echo "Running: python3 scripts/check_kalshi_prices.py ${ARGS[*]}"
          set +e
          python3 scripts/check_kalshi_prices.py "${ARGS[@]}"
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Produce CSV from the same JSON result
        if: always() && steps.price_check.outcome == 'success'
        run: |
          python3 - <<'EOF'
          import json
          import csv

          with open("kalshi_price_check_result.json") as f:
              records = json.load(f)

          fieldnames = [k for k in records[0].keys() if not k.startswith("_")] if records else ["ticker"]
          with open("kalshi_price_check.csv", "w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, extrasaction="ignore")
              writer.writeheader()
              for r in records:
                  writer.writerow(r)

          with open("kalshi_price_check.json", "w") as f:
              json.dump(records, f, indent=2)
          EOF

      # Bug fix (root cause: the price-check tool computed rich
      # stage-by-stage diagnostics -- raw/normalized/classified/unknown/
      # filtered-by-stage counts, fetch endpoint/HTTP status, and an
      # always-populated `diagnosis` string -- but nothing ever
      # persisted or displayed them: they were only ever printed to
      # stderr behind --verbose, which this workflow never read. A
      # successful run returning zero markets therefore showed only
      # "0 market(s) matched" with no way to know why. This step reads
      # the now-always-written kalshi_price_check_metadata.json (via
      # the standalone, independently-tested
      # scripts/print_price_check_summary.py, avoiding a fragile inline
      # heredoc) and surfaces every counter in the job summary, so
      # "no silent zero results" holds for every future run.
      - name: Write job summary with full diagnostics
        if: always()
        env:
          IN_SOURCE: ${{ inputs.source }}
        run: |
          echo "## Kalshi Price Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source requested:** $IN_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f kalshi_price_check_metadata.json ]; then
            python3 scripts/print_price_check_summary.py kalshi_price_check_metadata.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result:** the price-check run did not complete successfully -- see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Mobile-reading mission: display EVERY returned market directly
      # in the job summary AND the workflow log, instead of requiring a
      # JSON/CSV artifact download -- the GitHub mobile app surfaces the
      # job summary and log tab far more readily than run artifacts.
      # This step is purely presentational: it reads the exact same
      # kalshi_price_check.json the JSON/CSV artifact steps below upload
      # unchanged, and renders it through the pure, independently-tested
      # lib.kalshi_price_check.format_mobile_markdown_table() (via the
      # thin scripts/print_price_check_table.py CLI wrapper) -- it never
      # re-fetches, re-prices, re-filters, or re-classifies anything, so
      # the tool's pricing/filtering/registry/normalization behavior is
      # completely unchanged by this step.
      #
      # `tee -a` writes the SAME rendered table to two places at once:
      # appended to "$GITHUB_STEP_SUMMARY" (the job summary page) and to
      # this step's own stdout (the workflow log) -- one rendering, both
      # destinations, so they can never drift out of sync with each
      # other. The table is capped at 250 rows for readability (any
      # remainder is called out explicitly); the JSON/CSV artifacts
      # produced below always remain the complete, uncapped result.
      - name: Display every returned market in the job summary and log
        if: always() && steps.price_check.outcome == 'success'
        run: |
          echo "### Market Prices" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/print_price_check_table.py kalshi_price_check.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # Artifact-usability investigation: actions/upload-artifact always
      # ZIPs the uploaded kalshi-price-check-json artifact -- inherent
      # GitHub Actions platform behavior, not fought here. This step
      # embeds the EXACT same kalshi_price_check.json directly in the
      # job summary as a collapsed, copy-pasteable raw-JSON block
      # instead -- a lightweight direct-consumption path that needs no
      # artifact download at all. Reads the same file the JSON/CSV
      # artifact steps upload unchanged; never re-fetches, re-prices,
      # re-filters, or re-classifies anything.
      - name: Embed raw JSON in the job summary (no artifact download needed)
        if: always() && steps.price_check.outcome == 'success'
        run: |
          echo "### Raw JSON" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/print_price_check_json_summary.py kalshi_price_check.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Write job summary footer
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_This tool reports market prices only. It does not determine whether a wager has positive expected value._" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metadata artifact
        if: always() && steps.price_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-price-check-metadata
          path: kalshi_price_check_metadata.json
          retention-days: 14

      - name: Upload JSON artifact
        if: always() && steps.price_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-price-check-json
          path: kalshi_price_check.json
          retention-days: 14

      - name: Upload CSV artifact
        if: always() && steps.price_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-price-check-csv
          path: kalshi_price_check.csv
          retention-days: 14

      - name: Build archive-ready bundle (artifact only, never committed)
        if: inputs.archive_snapshot && steps.price_check.outcome == 'success'
        run: |
          mkdir -p archive_bundle
          cp kalshi_price_check.json archive_bundle/
          cp kalshi_price_check.csv archive_bundle/
          echo "This bundle is an artifact for manual review only. It is NOT committed to the repository by this workflow." > archive_bundle/README.txt

      - name: Upload archive bundle artifact
        if: inputs.archive_snapshot && steps.price_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-price-check-archive-bundle
          path: archive_bundle/
          retention-days: 30

      # ── Market Research Corpus milestone: everything below this line is ──
      # NEW. It archives a complete, UNFILTERED market capture into the
      # shared EdgeLab research corpus every time this tool is run
      # successfully -- regardless of the team/game/scope/family/
      # include_unknown/include_closed filters above, which apply only to
      # this run's OWN display output. This makes its own independent live
      # fetch (same endpoint, same shape as "Capture Kalshi Snapshots
      # (Scheduled)"'s own step) rather than reusing anything from the
      # price-check tool itself, so that tool's pure/isolated core is
      # completely unaffected. Still no recommendations, no wagers, no
      # writes outside data/kalshi_registry_snapshots/ and data/edgelab/.
      - name: Set date for corpus archive
        id: corpus_date
        if: always() && steps.price_check.outcome == 'success'
        run: |
          echo "DATE=$(TZ='America/New_York' date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Archive an unfiltered complete-market capture for the research corpus
        id: corpus_archive
        if: always() && steps.price_check.outcome == 'success'
        run: |
          SNAP_DIR="data/kalshi_registry_snapshots"
          mkdir -p "$SNAP_DIR"
          TS=$(date -u +%H%M%S)
          SNAP_PATH="${SNAP_DIR}/kalshi_search_${DATE}_${TS}_standalone.json"

          CB=$(date +%s)
          if curl -sf \
              "https://edge-finder-api.vercel.app/api/kalshisearch?_cb=${CB}" \
              -H "Accept: application/json" -H "Cache-Control: no-cache" \
              -o "$SNAP_PATH"; then
            python3 - "$SNAP_PATH" "$DATE" <<'EOF'
          import json, sys, datetime
          path, date = sys.argv[1], sys.argv[2]
          with open(path) as f:
              d = json.load(f)
          d["fetched_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z")
          d["date"] = date
          with open(path, "w") as f:
              json.dump(d, f, separators=(",", ":"))
          EOF
            echo "snapshot_path=$SNAP_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: standalone corpus-archive live fetch failed -- the price-check display above is unaffected; nothing new to ingest this run." >&2
          fi

      - name: Ingest into EdgeLab market corpus (data/edgelab/ only)
        if: always() && steps.corpus_archive.outputs.snapshot_path != ''
        run: python3 scripts/edgelab/ingest_market_observations.py --date "$DATE" --source-system standalone_price_check

      - name: Commit market-corpus archive (data/kalshi_registry_snapshots/ and data/edgelab/ only)
        if: always() && steps.corpus_archive.outputs.snapshot_path != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "standalone price-check corpus archive: ${DATE} $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "data/kalshi_registry_snapshots/" \
            "data/edgelab/observations/${DATE}.jsonl.gz" \
            "data/edgelab/games/${DATE}.jsonl" \
            "data/edgelab/markets/${DATE}.jsonl" \
            "data/edgelab/research_runs/${DATE}.jsonl" \
            || { echo "ERROR: corpus archive commit could not be pushed -- the price-check display above is unaffected" >&2; exit 1; }
