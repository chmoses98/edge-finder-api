name: Prospective Model Snapshots (Scheduled)

# EdgeLab Prospective Model Snapshots milestone: re-evaluates the SAME
# production model (scripts/build_market_ledger.py's evaluate_game,
# reused unmodified via lib/edgelab/prospective_snapshot.py -- never a
# second "research model") several times during the pregame window, so
# future research can pair a durable, causally-timestamped model
# probability with the Kalshi price actually available at that same
# moment. See docs/EDGELAB_PROSPECTIVE_MODEL_SNAPSHOTS.md.
#
# This workflow is intentionally SEPARATE from
# capture-snapshots-scheduled.yml (which stays exactly as minimal as it
# already was -- price capture only, no model logic) and from
# fetch-slate.yml (the once-daily production recommendation pipeline).
# A failure here can NEVER block either of those: this workflow shares
# no steps, no concurrency group, and (aside from read-only reads of
# data/slate.json) no write path with them -- it writes ONLY
# data/edgelab/model_evaluations/<date>.jsonl and
# data/edgelab/research_runs/<date>.jsonl, both via the existing
# idempotent lib.edgelab.storage.append_records.
#
# Never places a bet, never mutates bankroll, never writes
# data/edgelab/recommendations/ or data/edgelab/bets/, never calls
# scripts/risk_gate.py or scripts/write_pending_bets.py, never writes
# data/slate.json.
#
# Cadence: every 15 minutes during the MLB pregame window (a finer
# cadence than capture-snapshots-scheduled.yml's 30 minutes, so each
# T_MINUS_90/60/30/MODEL_CLOSING_WINDOW target is reliably caught within tolerance).
# Each run is cheap: scripts/build_market_ledger.py's evaluate_game()
# has zero external API calls (CPU-only, reusing data/slate.json's
# already-fetched projections); the only network call this workflow
# makes per run is one MLB Stats API schedule fetch (free, unmetered)
# plus, only for games whose lineup just became available, one lineup
# fetch per such game (also MLB Stats API, free) -- see
# lib/edgelab/prospective_snapshot.py's module docstring for why this
# deliberately does NOT re-fetch odds/weather/Savant data every cycle
# (both are metered/rate-limited services; a documented 429-flood
# incident already exists in this repo's history).

on:
  schedule:
    - cron: '*/15 16,17,18,19,20,21,22,23 * * *'   # 16:00-23:45 UTC
    - cron: '*/15 0,1,2,3,4,5 * * *'                 # 00:00-05:45 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date to evaluate (YYYY-MM-DD). Leave blank for data/slate.json''s own date.'
        required: false
        default: ''
      dry_run:
        description: 'Compute and log without writing anything'
        required: false
        default: 'false'

concurrency:
  group: edgelab-model-snapshot
  cancel-in-progress: false

# RELIABILITY PASS (this workflow's own persistence, not raw Kalshi
# capture): per-game model-evaluation failures are already isolated
# inside lib/edgelab/prospective_snapshot.py itself (one malformed
# game's inputs never abort the cycle -- see that module's own
# per-game try/except). A WHOLE-RUN infrastructure failure -- most
# importantly, the generated ModelEvaluation data failing to persist to
# git after lib/scripts/ci/git_data_commit.py's own bounded
# fetch/rebase/push retries (4 attempts, 5/10/15/20s backoff) are
# exhausted -- is a DIFFERENT kind of failure and must be VISIBLE: this
# job deliberately does NOT set continue-on-error, and the "Commit new
# model evaluations" step below is deliberately never followed by
# `|| echo ...` or any other exit-code-swallowing pattern. Because this
# workflow shares no job, step, or concurrency group with
# capture-snapshots-scheduled.yml or fetch-slate.yml (see this file's
# own header above), a red run here can never block or slow down either
# of those -- there is nothing left here to hide a failure FROM.
#
# "Will retry next cycle" is not a true recovery path on an ephemeral
# GitHub Actions runner: if push fails, the runner's local filesystem
# (including every uncommitted change this run generated) is discarded
# when the job ends, and the NEXT scheduled run starts from a fresh
# checkout -- by the time it runs, the exact checkpoint window this run
# targeted (e.g. a specific game's T_MINUS_30) may already have closed,
# so that exact model state could never be regenerated. This workflow
# therefore backs up the generated files to a location OUTSIDE the git
# working tree BEFORE attempting to commit (scripts/ci/git_data_commit.py
# resets the working tree to origin's tip on a failed push -- see its
# own _abort_and_reset -- so uploading the POST-failure working tree
# would upload the WRONG, reverted content), and uploads that backup as
# a GitHub Actions artifact if persistence ultimately fails, so the
# exact generated snapshot data is never silently lost -- only ever
# either committed, or recoverable from the run's own artifact.
jobs:
  prospective-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run prospective snapshot cycle
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/edgelab/run_prospective_snapshots.py $ARGS

      - name: Back up generated snapshot files (pre-commit, recoverability)
        if: github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p /tmp/prospective-snapshot-backup
          cp -r data/edgelab/model_evaluations /tmp/prospective-snapshot-backup/ 2>/dev/null || true
          cp -r data/edgelab/research_runs /tmp/prospective-snapshot-backup/ 2>/dev/null || true

      - name: Commit new model evaluations
        id: commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "prospective model snapshot $(date -u +'%Y-%m-%d %H:%M UTC')" \
            data/edgelab/model_evaluations/ data/edgelab/research_runs/

      - name: Preserve generated snapshots as a recoverable artifact (persistence failed)
        if: always() && github.event.inputs.dry_run != 'true' && steps.commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: prospective-model-snapshot-unpersisted-${{ github.run_id }}
          path: /tmp/prospective-snapshot-backup/
          retention-days: 14
          if-no-files-found: warn

      - name: Fail visibly if persistence failed
        if: steps.commit.outcome == 'failure'
        run: |
          echo "::error::Failed to persist prospective model snapshots after scripts/ci/git_data_commit.py's bounded retries. The generated ModelEvaluation/research-run data was NOT lost -- see the 'prospective-model-snapshot-unpersisted-${{ github.run_id }}' artifact on this run for manual recovery -- but it was NOT committed either. This is an infrastructure failure, not a per-game model failure."
          exit 1
