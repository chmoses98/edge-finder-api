name: PR Checks (deterministic test suite)

# Production Reliability and Settlement Recovery milestone
# (docs/POSTMORTEM_PRODUCTION_RELIABILITY_2026.md "Pull-request CI"):
# before this milestone, NONE of this repository's 14 workflows
# triggered on `pull_request` -- 111+ test files existed and ran only
# when a human remembered to run them locally. This workflow closes that
# gap with a read-only, network-free, secrets-free, commit-free test run.
#
# Scope, mapped to the milestone's own category list:
#   - production pricing/unit tests   -> tests/test_executable_price*.py,
#     tests/test_build_market_ledger*.py, tests/test_calc_pl*.py, etc.
#   - Kalshi registry/classifier tests -> tests/test_kalshi_*.py,
#     tests/test_build_kalshi_registry*.py, tests/research/*
#   - settlement tests                -> tests/test_clv_update*.py,
#     tests/test_determine_result*.py, tests/test_f5_settlement*.py,
#     tests/test_bet_backlog_classifier.py (this milestone)
#   - EdgeLab tests                   -> tests/edgelab/*
#   - workflow safety/isolation tests -> tests/test_check_kalshi_prices_safety_isolation.py,
#     tests/test_*_workflow*.py, tests/test_workflow_concurrency_groups.py (this milestone)
#   - schema validation                -> tests/test_schema*.py, tests/edgelab/test_schema.py
#   - configuration validation          -> tests/test_rules_config_validation.py (this milestone)
#
# In practice these all live in one deterministic, fully-mocked pytest
# suite (confirmed during this milestone: the entire suite passes with
# ZERO network access) -- so rather than hand-curate a fragile subset,
# this workflow runs the whole suite as one pass/fail gate, split into
# two steps only to separate genuine CI regressions from a known,
# narrow, environment-only limitation (see step 2's comment).
#
# No live API dependency: the full suite already runs network-free (this
# is what makes it deterministic and CI-safe -- confirmed, not assumed).
# No secrets: nothing here needs ODDS_API_KEY or any other secret. No
# writes to production files or automated commits: `permissions:
# contents: read` and no git-add/commit/push step exists anywhere below.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0, not the GitHub Actions default of 1 --
          # several existing "changed-file-scope" regression tests
          # (e.g. tests/test_validate_slate_final_pr9_changed_file_scope.py)
          # diff against specific historical commit SHAs and need full
          # history to resolve them; a shallow checkout makes those
          # `git diff <sha>..<sha>` calls fail with "unknown revision"
          # (exit 128) -- an environment artifact, not a real test
          # failure. See step 2 below for the belt-and-suspenders
          # fallback if history is ever unavailable regardless.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements-ci.txt

      - name: Run deterministic test suite (excluding known environment-only checks)
        id: main_suite
        run: |
          python3 -m pytest tests/ -q \
            --deselect "tests/research/test_kalshi_market_inventory.py::TestInventoryBuild::test_f5_tie_marked_as_dead_data_path_not_consumed" \
            --deselect "tests/test_risk_gate_review_parts_v_to_y.py::TestFinalScopeReVerification::test_only_risk_gate_py_changed_outside_tests_and_docs_across_the_whole_pr" \
            --deselect "tests/test_validate_slate_final_pr9_changed_file_scope.py::TestPR9ChangedFileScope::test_only_expected_production_file_changed" \
            --deselect "tests/test_validate_slate_final_pr9_changed_file_scope.py::TestPR9ChangedFileScope::test_no_data_or_ledger_files_touched" \
            --deselect "tests/test_validate_slate_final_pr9_changed_file_scope.py::TestPR9ChangedFileScope::test_no_workflow_files_touched"

      - name: Run known environment-only checks (informational, non-blocking)
        id: env_only
        if: always()
        continue-on-error: true
        run: |
          # These 5 tests diff against specific historical commit SHAs
          # (fe0a19c.. / b006c39.. etc.) that this milestone's own
          # investigation confirmed are unreachable ONLY in a shallow or
          # otherwise history-limited clone -- never a real code
          # regression. `fetch-depth: 0` above should make them pass on
          # a real GitHub-hosted runner; this step is a documented,
          # non-blocking safety net in case that assumption ever breaks
          # (e.g. a future history rewrite), so a real regression in one
          # of these files is still visible in the job log without being
          # able to block every future PR on an infrastructure quirk
          # nobody here controls.
          python3 -m pytest tests/ -q \
            "tests/research/test_kalshi_market_inventory.py::TestInventoryBuild::test_f5_tie_marked_as_dead_data_path_not_consumed" \
            "tests/test_risk_gate_review_parts_v_to_y.py::TestFinalScopeReVerification::test_only_risk_gate_py_changed_outside_tests_and_docs_across_the_whole_pr" \
            "tests/test_validate_slate_final_pr9_changed_file_scope.py::TestPR9ChangedFileScope::test_only_expected_production_file_changed" \
            "tests/test_validate_slate_final_pr9_changed_file_scope.py::TestPR9ChangedFileScope::test_no_data_or_ledger_files_touched" \
            "tests/test_validate_slate_final_pr9_changed_file_scope.py::TestPR9ChangedFileScope::test_no_workflow_files_touched"

      - name: Summary
        if: always()
        run: |
          {
            echo "## PR CI summary"
            echo ""
            if [ "${{ steps.main_suite.outcome }}" = "success" ]; then
              echo "- Deterministic suite: **PASS**"
            else
              echo "- Deterministic suite: **FAIL** -- see \"Run deterministic test suite\" step above for the failing test(s). This blocks merge."
            fi
            if [ "${{ steps.env_only.outcome }}" = "success" ]; then
              echo "- Known environment-only checks (5 tests, history-dependent): PASS"
            else
              echo "- Known environment-only checks (5 tests, history-dependent): FAILED -- informational only, does not block merge. If this surprises you, re-read this workflow's \"Run known environment-only checks\" step comment before assuming it's safe to ignore."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if the deterministic suite failed
        if: steps.main_suite.outcome != 'success'
        run: exit 1
