name: Kalshi Quick Check
on:
  workflow_dispatch:
    inputs:
      date:
        required: false
        default: ''
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set date
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          echo "DATE=$DATE" >> $GITHUB_ENV
      - name: Quick check
        run: python3 scripts/quick_check.py ${{ env.DATE }} 2>&1 | tee data/quick_check_output.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quick_check_output.txt
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "quick check $(TZ='America/New_York' date +'%Y-%m-%d %H:%M ET')" && git push
