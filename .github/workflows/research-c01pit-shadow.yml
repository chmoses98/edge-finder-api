name: Research - C01-PIT Prospective Shadow (Manual/Scheduled)

# MLB-ALPHA-0001 prospective shadow. RESEARCH ONLY -- places no orders,
# feeds no recommendation, staking, eligibility or risk-gate path, and
# never writes bets.json, config/rules.json or any settlement store.
#
# Kalshi egress is blocked in the research sandbox, so the collector runs
# here. Two passes per invocation: the frozen c01pit_trigger_v1 stream
# (the ONLY stream that may create an official entry) and an
# observational pass flagged canTriggerC01Pit=false that exists to give
# CLV a genuinely later closing quote.
#
# Commits append-only research artifacts to a research branch, never main.

on:
  # Section P: the frozen c01pit_trigger_v1 stream is a 10-minute
  # prospective trigger. It had no cadence and therefore zero rows; this
  # adds the cadence WITHOUT touching the frozen protocol, rule, band,
  # window or checkpoint. Schedules only fire from the default branch.
  schedule:
    - cron: '*/10 15-23 * * *'
    - cron: '*/10 0-5 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Research branch to check out and push results to'
        required: false
        default: 'research/mlb-alpha-prospective'
      orderbook:
        description: 'Also read the public order-book endpoint for depth (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: c01pit-shadow-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to run against a protected branch
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$TARGET_BRANCH" = "main" ] || [ "$TARGET_BRANCH" = "master" ] || [ "$TARGET_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Refusing to run against protected branch '$TARGET_BRANCH'." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Capture C01-PIT shadow (trigger + observational passes)
        id: capture
        run: |
          if [ "${{ inputs.orderbook }}" = "true" ]; then
            python3 scripts/research/mlb_alpha_0001/shadow_capture.py --orderbook | tee shadow_out.txt
          else
            python3 scripts/research/mlb_alpha_0001/shadow_capture.py | tee shadow_out.txt
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "### C01-PIT prospective shadow capture" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat shadow_out.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit append-only shadow rows (research branch only)
        if: always() && steps.capture.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "C01-PIT shadow capture $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --branch "${{ inputs.branch }}" \
            data/edgelab/research_artifacts/mlb_alpha_0001/shadow/ \
            || echo "nothing to commit"
