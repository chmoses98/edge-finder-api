name: Research - Hitter W2 MLB feed backfill (PR branch only)

# SIFT Wave 2, MLB hitter lane. RESEARCH ONLY.
# Fetches public MLB Stats API game feeds (sports data only; no odds, no
# Kalshi, no settlement records) for the regular-season gamePks already
# committed in data/research_cache/bullpen_backtest/<season>/schedules/,
# extracts compact player-game / plate-appearance CSVs and commits them to
# the PR branch that triggered the run -- never to main. The research
# sandbox cannot reach statsapi.mlb.com; GitHub-hosted runners can.
# Idempotent: a season whose manifest.json says complete is skipped.
# No schedule trigger. GITHUB_TOKEN pushes do not retrigger workflows.

on:
  pull_request:
    paths:
      - '.github/workflows/research-hitter-w2-backfill.yml'
      - 'scripts/research/hitter_w2/fetch_pbp_backfill.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-hitter-w2-backfill-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        season: [2024, 2025, 2026]
    steps:
      - name: Refuse protected branches
        env:
          TARGET: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$TARGET" = "main" ] || [ "$TARGET" = "master" ] || [ "$TARGET" = "$DEFAULT_BRANCH" ]; then
            echo "::error::refusing to run against $TARGET"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch + extract season ${{ matrix.season }}
        run: python3 scripts/research/hitter_w2/fetch_pbp_backfill.py --season ${{ matrix.season }} --workers 6
      - uses: actions/upload-artifact@v4
        with:
          name: hitter-w2-feed-${{ matrix.season }}
          path: data/research/hitter_w2/mlb_feed/${{ matrix.season }}/
          if-no-files-found: ignore
          retention-days: 7

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: hitter-w2-feed-*
          path: _feed
      - name: Place, validate and commit
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e
          for s in 2024 2025 2026; do
            if [ -f "_feed/hitter-w2-feed-$s/manifest.json" ]; then
              mkdir -p data/research/hitter_w2/mlb_feed/$s
              cp _feed/hitter-w2-feed-$s/* data/research/hitter_w2/mlb_feed/$s/
            fi
          done
          rm -rf _feed
          python3 - <<'EOF'
          import csv, glob, gzip, json
          for m in sorted(glob.glob("data/research/hitter_w2/mlb_feed/*/manifest.json")):
              d = json.load(open(m))
              n = sum(1 for _ in csv.DictReader(gzip.open(m.replace("manifest.json", "batting.csv.gz"), "rt")))
              assert n == d["rows"]["batting"], (m, n)
              print(m, d["extracted"], "games", n, "batting rows", "failed", len(d["failed"]))
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "research(hitter-w2): MLB feed backfill (sports-only player-game + PA extracts)" \
            --branch "$BRANCH" \
            "data/research/hitter_w2/mlb_feed/" \
            || { echo "ERROR: hitter-w2 backfill commit could not be pushed" >&2; exit 1; }
