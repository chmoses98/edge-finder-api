name: Research - MRV Prospective Capture v1 (bounded multi-cycle)

# RESEARCH ONLY. READ-ONLY public endpoints (Kalshi markets/orderbook/trades,
# MLB Stats API schedule + live feed, The Odds API with the existing
# ODDS_API_KEY). Places no orders; imports no eligibility, recommendation,
# staking, routing or settlement code. Writes ONLY under
# data/edgelab/research_artifacts/mrv_prospective/v1/ and commits ONLY to
# the research branch research/mrv-prospective-v1 -- never main, never the
# MLB-ALPHA-0002 branch or path, so the frozen ALPHA-0002 shadows keep their
# data universe.
#
# CADENCE DESIGN. GitHub delivered 3-8 of 84 requested 10-minute slots/day
# to the ALPHA-0002 collector (docs/MLB_ALPHA_0002_SCHEDULE_HEALTH.md).
# So this workflow does not rely on one scheduled event per capture: each
# job is a bounded loop (run_loop.py) that captures every 10 minutes for up
# to 340 minutes and persists after EVERY cycle. The hourly schedule plus a
# non-cancelling concurrency group means a new job queues behind the running
# one and starts the moment it ends, so delivered cadence depends on the
# loop, not on scheduler punctuality. The persisted manifests are the only
# cadence evidence (build_health.py); nothing here claims a cadence.
#
# This is the repo-native path. An always-on external runner
# (scripts/research/mrv_collector/external_runner.sh) is the primary path
# once the owner deploys it; both write the same corpus with distinct
# trigger labels.

on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: 'Loop budget in minutes (max 340)'
        required: false
        default: '340'
      cadence_minutes:
        description: 'Target minutes between cycle starts'
        required: false
        default: '10'
  schedule:
    # One trigger per hour, all day: the loop covers the MLB window (15:00-04:59
    # UTC) and the queued job chains behind the running one.
    - cron: '11 * * * *'

permissions:
  contents: write
  actions: write        # only so a completed job can dispatch its one successor (last step)

concurrency:
  group: mrv-prospective-capture-v1
  cancel-in-progress: false

# KILL SWITCH: repository variable MRV_CONTINUOUS_CAPTURE_ENABLED.  Unset (the
# default) or any value other than false/0/no/off/disabled = continuous capture
# ON.  Set it to `false` to stop: the running job finishes its bounded budget,
# requests no successor, and cron-triggered runs are skipped.  A manual
# workflow_dispatch still runs one bounded job (without chaining).
jobs:
  capture:
    if: github.event_name != 'schedule' || !contains(fromJSON('["false","0","no","off","disabled"]'), vars.MRV_CONTINUOUS_CAPTURE_ENABLED)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out or create the MRV research data branch
        run: |
          set -euo pipefail
          B=research/mrv-prospective-v1
          # First live run (35925944608) proved a branch created only locally
          # can never be persisted: git_data_commit.py begins with
          # `git fetch origin <branch>`, which fails for a branch the remote
          # lacks, so every cycle's rows stayed on the ephemeral runner.  A
          # missing research branch is therefore created ON THE REMOTE, at the
          # default-branch commit, before any cycle runs; a failed create
          # fails the job instead of collecting rows that cannot be kept.
          if git fetch origin "$B"; then
            git checkout "$B"
          else
            git checkout -b "$B"
            git push origin "HEAD:refs/heads/$B"
            git fetch origin "$B"
          fi
          # Collector code always comes from the default branch; only the data path lives on the research branch.
          git checkout origin/${{ github.event.repository.default_branch }} -- lib scripts data/edgelab/research_artifacts/mrv_prospective/mrv_series_policy.json
          git reset -q lib scripts data/edgelab/research_artifacts/mrv_prospective/mrv_series_policy.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bounded multi-cycle capture (read-only; persists after every cycle)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          B="${{ inputs.budget_minutes || '340' }}"
          C="${{ inputs.cadence_minutes || '10' }}"
          if [ "$B" -gt 340 ]; then B=340; fi
          python3 scripts/research/mrv_collector/run_loop.py --budget-minutes "$B" --cadence-minutes "$C" --branch research/mrv-prospective-v1

      # The step's own console copy goes to $RUNNER_TEMP, never the checkout:
      # run 35925944608 wrote it to the repo root and the scope check below
      # then failed every run on that untracked file.
      - name: Health report (from the persisted corpus only)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/research/mrv_collector/build_health.py --write | tee "$RUNNER_TEMP/health_out.txt"
          python3 scripts/ci/git_data_commit.py \
            --message "MRV prospective health $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --branch research/mrv-prospective-v1 \
            data/edgelab/research_artifacts/mrv_prospective/v1/health || echo "::warning::health persist failed"
          echo "### MRV prospective capture v1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 "$RUNNER_TEMP/health_out.txt" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify persistence stayed inside the MRV v1 path
        if: always()
        run: |
          set -euo pipefail
          # Collector code is checked out from the default branch into the working tree
          # (unstaged, never committed here); only the MRV v1 data path may carry
          # committed changes. Anything else dirty is a defect.
          DIRTY="$(git status --porcelain | grep -v 'data/edgelab/research_artifacts/mrv_prospective/v1/' | grep -v '^ M lib/' | grep -v '^ M scripts/' | grep -v 'mrv_series_policy.json' || true)"
          if [ -n "$DIRTY" ]; then
            echo "::error::working tree carries changes outside the MRV v1 path" >&2
            echo "$DIRTY" | head -20
            exit 1
          fi
          # The ALPHA-0002 corpus must never be touched by this job.
          if [ -n "$(git status --porcelain -- data/edgelab/research_artifacts/mlb_alpha_0002/ || true)" ]; then
            echo "::error::ALPHA-0002 path modified by the MRV job" >&2; exit 1
          fi
          echo "ALPHA-0002 path untouched"

      # A capture that collects rows and fails to persist them is a FAILED
      # run, not a green one: prove the rows reached the remote research branch.
      - name: Verify the rows reached the research branch
        if: always()
        run: |
          set -euo pipefail
          B=research/mrv-prospective-v1
          P=data/edgelab/research_artifacts/mrv_prospective/v1
          if [ -n "$(git status --porcelain -- "$P/")" ]; then
            echo "::error::uncommitted MRV rows remain in the working tree -- persistence failed" >&2
            git status --porcelain -- "$P/" | head -20
            exit 1
          fi
          git fetch --no-tags origin "$B" \
            || { echo "::error::research branch '$B' does not exist on the remote" >&2; exit 1; }
          N="$(git ls-tree -r --name-only FETCH_HEAD -- "$P/runs" | wc -l)"
          echo "MRV manifests present on $B: $N"
          if [ "$N" -eq 0 ]; then
            echo "::error::no MRV run manifests present on '$B' after this run" >&2
            exit 1
          fi

      # CONTINUITY. GitHub delivered 1 of this workflow's first 5 hourly cron slots,
      # so a chain that waits for a scheduled event leaves multi-hour gaps. A job
      # whose every step succeeded (capture with no failed cycle, rows verified on
      # the research branch, isolation checks) on the default branch requests at
      # most ONE successor with the normal budget_minutes=340 / cadence_minutes=10.
      # No successor after a failed or cancelled job (success() is false), when
      # the kill switch is off, or when another run of this workflow is already
      # queued (for example a cron run). The non-cancelling concurrency group above
      # admits one running + one pending job, so collectors never overlap. The
      # hourly cron stays as the fallback that restarts a stopped chain.
      - name: Request the successor capture job
        if: success() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MRV_CONTINUOUS_CAPTURE_ENABLED: ${{ vars.MRV_CONTINUOUS_CAPTURE_ENABLED }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/research/mrv_collector/chain_successor.py \
            --workflow research-mrv-prospective-capture.yml \
            --ref "${{ github.event.repository.default_branch }}" | tee -a "$GITHUB_STEP_SUMMARY"
