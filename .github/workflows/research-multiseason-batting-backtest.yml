name: Research - Multi-Season Batting Backtest Cache (Manual)

# Research Lab MLB-RSCH-0012. RESEARCH ONLY -- this workflow never
# touches production code paths, never writes to config/rules.json,
# bets.json, or any settlement/staking/risk-gate file, and never runs
# on any schedule or pull_request trigger. Manual dispatch only, same
# discipline as research-multiseason-bullpen-backtest.yml (MLB-RSCH-0003).
#
# WHY THIS EXISTS: this repository's own CI/local dev environments have
# no outbound network access to statsapi.mlb.com (confirmed by both
# MLB-RSCH-0003's own audit and this milestone's own repeated
# confirmation). scripts/edgelab/backtest/fetch_mlb_multiseason_batting_cache.py
# is fully deterministic and network-free once the cache exists -- only
# the FETCH step needs real network access, which GitHub-hosted runners
# have. Reuses MLB-RSCH-0003's own already-cached schedules (never
# re-fetches them) -- only NEW per-game boxscore fetches are made here.
#
# Commits to the SAME research branch this workflow was dispatched on
# (never main) -- results land as a normal push to an open research PR,
# reviewed and merged like any other Research Lab deliverable, never
# auto-merged.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated seasons to fetch'
        required: false
        default: '2022,2023,2024,2025,2026'
      rate_limit_seconds:
        description: 'Delay between MLB Stats API requests (be a considerate citizen)'
        required: false
        default: '0.25'
      max_games_per_season:
        description: 'Cap NEW boxscore fetches per season this run (optional -- for a partial/test run)'
        required: false
        default: ''
      branch:
        description: 'Branch to check out, fetch into, and push results to'
        required: false
        default: 'claude/mlb-rsch-0012-offense-talent'

permissions:
  contents: write

concurrency:
  group: research-multiseason-batting-backtest-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # thousands of rate-limited requests -- see fetch script's own module docstring
    steps:
      # Hard guard, not just a comment: this workflow's last step pushes a
      # commit to inputs.branch (scripts/ci/git_data_commit.py). Refuse
      # outright if that branch is main, master, or this repository's
      # actual default branch.
      - name: Refuse to run against a protected branch
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$TARGET_BRANCH" = "main" ] || [ "$TARGET_BRANCH" = "master" ] || [ "$TARGET_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Refusing to run against protected branch '$TARGET_BRANCH' (repository default branch is '$DEFAULT_BRANCH'). This workflow commits research cache/results and must only ever target a research branch, never main, master, or the repository default branch." >&2
            exit 1
          fi
          echo "Target branch '$TARGET_BRANCH' is not protected (default branch is '$DEFAULT_BRANCH') -- proceeding."

      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements-ci.txt

      - name: Fetch + cache multi-season MLB team batting box scores
        id: fetch
        run: |
          python3 scripts/edgelab/backtest/fetch_mlb_multiseason_batting_cache.py \
            --seasons "${{ inputs.seasons }}" \
            --rate-limit-seconds "${{ inputs.rate_limit_seconds }}" \
            ${{ inputs.max_games_per_season != '' && format('--max-games-per-season {0}', inputs.max_games_per_season) || '' }} \
            | tee fetch_result.json

      - name: Run focused batting-reconstruction tests (never network-dependent)
        run: |
          python3 -m pytest tests/edgelab/test_team_batting_reconstruction.py \
            tests/edgelab/test_fetch_mlb_multiseason_batting_cache.py -q

      - name: Write job summary
        if: always()
        run: |
          echo "### Multi-Season Batting Backtest Cache Fetch" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat fetch_result.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit cache (research branch only, never main)
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "MLB-RSCH-0012 multi-season batting backtest cache $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --branch "${{ inputs.branch }}" \
            "data/research_cache/batting_backtest/" \
            || { echo "ERROR: batting cache commit could not be pushed" >&2; exit 1; }
