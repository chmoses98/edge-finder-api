name: Research - Multi-Season Bullpen Workload Backtest (Manual)

# Research Lab MLB-RSCH-0003. RESEARCH ONLY -- this workflow never
# touches production code paths, never writes to config/rules.json,
# bets.json, or any settlement/staking/risk-gate file, and never runs
# on any schedule or pull_request trigger. Manual dispatch only, because
# a full 2022-2026 pull is a large, deliberate, occasional action, not
# a routine automated job like this repo's daily capture workflows.
#
# WHY THIS EXISTS: this repository's own CI/local dev environments have
# no outbound network access to statsapi.mlb.com (confirmed during this
# milestone: a direct request returns HTTP 403 from the environment's
# proxy). scripts/edgelab/backtest/fetch_mlb_multiseason_bullpen_cache.py
# and scripts/edgelab/run_multiseason_bullpen_backtest_experiment.py are
# fully deterministic and network-free once the cache exists -- only
# the FETCH step needs real network access, which GitHub-hosted runners
# have.
#
# Commits to the SAME research branch this workflow was dispatched on
# (never main) -- results land as a normal push to an open research PR,
# reviewed and merged like any other Research Lab deliverable, never
# auto-merged.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated seasons to fetch/backtest'
        required: false
        default: '2022,2023,2024,2025,2026'
      rate_limit_seconds:
        description: 'Delay between MLB Stats API requests (be a considerate citizen)'
        required: false
        default: '0.25'
      max_games_per_season:
        description: 'Cap NEW boxscore fetches per season this run (optional -- for a partial/test run)'
        required: false
        default: ''
      branch:
        description: 'Branch to check out, fetch into, and push results to'
        required: false
        default: 'claude/mlb-multiseason-bullpen-backtest-milestone4'

permissions:
  contents: write

concurrency:
  group: research-multiseason-bullpen-backtest-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # thousands of rate-limited requests -- see fetch script's own module docstring
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch + cache multi-season MLB schedule/boxscore data
        id: fetch
        run: |
          python3 scripts/edgelab/backtest/fetch_mlb_multiseason_bullpen_cache.py \
            --seasons "${{ inputs.seasons }}" \
            --rate-limit-seconds "${{ inputs.rate_limit_seconds }}" \
            ${{ inputs.max_games_per_season != '' && format('--max-games-per-season {0}', inputs.max_games_per_season) || '' }} \
            | tee fetch_result.json

      - name: Run the multi-season backtest (preregisters, then analyzes)
        id: backtest
        run: |
          python3 scripts/edgelab/run_multiseason_bullpen_backtest_experiment.py | tee backtest_result.json

      - name: Run focused backtest tests (never network-dependent)
        run: |
          python3 -m pytest tests/edgelab/test_bullpen_backtest_reconstruction.py \
            tests/edgelab/test_bullpen_backtest_stats.py \
            tests/edgelab/test_fetch_mlb_multiseason_bullpen_cache.py \
            tests/edgelab/test_run_multiseason_bullpen_backtest_experiment_script.py -q

      - name: Write job summary
        if: always()
        run: |
          echo "### Multi-Season Bullpen Workload Backtest" >> "$GITHUB_STEP_SUMMARY"
          echo '#### Fetch result' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat fetch_result.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '#### Backtest result' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat backtest_result.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit cache + results (research branch only, never main)
        if: always() && steps.backtest.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/git_data_commit.py \
            --message "MLB-RSCH-0003 multi-season bullpen backtest cache/results $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --branch "${{ inputs.branch }}" \
            "data/research_cache/bullpen_backtest/" \
            "data/edgelab/experiments/MLB-RSCH-0003.json" \
            "data/edgelab/experiment_reports/MLB-RSCH-0003/" \
            "data/edgelab/analytics/latest_mlb_rsch_0003_multiseason_bullpen_backtest.json" \
            || { echo "ERROR: backtest results commit could not be pushed" >&2; exit 1; }
