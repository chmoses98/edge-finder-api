name: Kalshi API Diagnostic

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to test (YYYY-MM-DD)"
        required: false
        default: "2026-06-03"

jobs:
  test-kalshi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Kalshi diagnostic
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ="America/New_York" date -d "yesterday" +%Y-%m-%d 2>/dev/null || \
                   TZ="America/New_York" date -v-1d +%Y-%m-%d)
          fi
          echo "Testing Kalshi API for $DATE"
          python3 test_kalshi.py "$DATE" 2>&1 | tee kalshi_diagnostic_output.txt
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kalshi_diagnostic_output.txt
          git diff --cached --quiet || git commit -m "kalshi diagnostic output" && git push

