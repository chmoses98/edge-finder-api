name: Kalshi API Diagnostic

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to test (YYYY-MM-DD)"
        required: false
        default: "2026-06-03"

jobs:
  test-kalshi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run F5 Odds API diagnostic
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 test_f5_odds.py 2>&1 | tee kalshi_diagnostic_output.txt
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kalshi_diagnostic_output.txt
          git diff --cached --quiet || (git commit -m "f5 odds diagnostic output" && git push)

