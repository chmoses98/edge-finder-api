name: Kalshi API Diagnostic
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch scores
        run: python3 settle_scores.py 2>&1 | tee kalshi_diagnostic_output.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kalshi_diagnostic_output.txt scores_june2_3.json
          git diff --cached --quiet || (git commit -m "scores june 2-3" && git push)

