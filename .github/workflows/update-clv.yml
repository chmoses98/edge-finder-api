name: Update CLV (Post-Slate Review)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to pull closing lines for (YYYY-MM-DD). Leave blank for yesterday ET.'
        required: false
        default: ''
  schedule:
    # Runs at 1:00 AM ET (06:00 UTC) — all games finished, lines settled
    - cron: '0 6 * * *'

jobs:
  update-clv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run CLV update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d 'yesterday' +%Y-%m-%d 2>/dev/null || \
                   TZ='America/New_York' date -v-1d +%Y-%m-%d)
          fi
          echo "Running CLV update for $DATE"
          python3 clv_update.py

      - name: Commit updated bet log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bets.json BET_LOG.md
          git diff --cached --quiet && echo "No CLV changes to commit" || \
            git commit -m "clv update $(TZ='America/New_York' date +'%Y-%m-%d %H:%M ET')" && git push
