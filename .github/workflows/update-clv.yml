name: Update CLV (Post-Slate Review)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to pull closing lines for (YYYY-MM-DD). Leave blank for yesterday ET.'
        required: false
        default: ''
  schedule:
    # 1:00 AM ET (06:00 UTC) — all games finished, lines settled
    - cron: '0 6 * * *'

jobs:
  update-clv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can restore slate by date

      - name: Restore date-specific slate
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d 'yesterday' +%Y-%m-%d 2>/dev/null || \
                   TZ='America/New_York' date -v-1d +%Y-%m-%d)
          fi
          echo "Restoring slate for $DATE"
          # Find the last commit that touched data/slate.json on DATE (ET = UTC-4/5)
          # Search commits with "slate data YYYY-MM-DD" in message
          SLATE_COMMIT=$(git log --oneline --format="%H %s" -- data/slate.json | \
                         grep "slate data $DATE" | head -1 | awk '{print $1}')
          if [ -n "$SLATE_COMMIT" ]; then
            echo "  Found slate commit: $SLATE_COMMIT"
            git show "$SLATE_COMMIT:data/slate.json" > data/slate.json
            echo "  Restored data/slate.json from $SLATE_COMMIT"
          else
            echo "  No date-specific slate found for $DATE — using current slate"
          fi

      - name: Run CLV update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d 'yesterday' +%Y-%m-%d 2>/dev/null || \
                   TZ='America/New_York' date -v-1d +%Y-%m-%d)
          fi
          echo "Running CLV update for $DATE"
          python3 clv_update.py "$DATE"

      - name: Commit CLV updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bets.json BET_LOG.md
          git diff --cached --quiet && echo "No CLV changes" || \
            git commit -m "clv update $(TZ='America/New_York' date +'%Y-%m-%d %H:%M ET')" && git push
