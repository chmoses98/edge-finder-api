name: Update CLV (Post-Slate Review)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to pull closing lines for (YYYY-MM-DD). Leave blank for yesterday ET.'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-clv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch CLV from Vercel + update files
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d 'yesterday' +%Y-%m-%d 2>/dev/null || \
                   TZ='America/New_York' date -v-1d +%Y-%m-%d)
          fi
          echo "Fetching CLV for $DATE..."
          CB=$(date +%s)

          # Pull bets needing CLV, POST them to Vercel, get back updated bets
          python3 << PYEOF
          import json, urllib.request, urllib.error, sys

          DATE = "$DATE"

          with open('bets.json') as f:
              bets = json.load(f)

          SUPPORTED = {'ML','F5 ML','Total','Game Total','Run Line','RL','Team Total','TT'}
          UNSUPPORTED = {'YRFI','NRFI','K Prop','Pitcher Prop','Batter Prop'}

          # Mark unsupported immediately
          for b in bets:
              if b.get('clv') is None and b.get('market') in UNSUPPORTED and b.get('result') in ('WIN','LOSS','PUSH'):
                  b['closingLineSource'] = 'market_unavailable'

          targets = [
              b for b in bets
              if b.get('date') == DATE
              and b.get('clv') is None
              and b.get('result') in ('WIN','LOSS','PUSH')
              and b.get('market') in SUPPORTED
              and b.get('closingLineSource') not in ('expired_no_betTimeLine','market_unavailable')
          ]

          print(f"Bets to process: {len(targets)}")
          if not targets:
              print("Nothing to update.")
              with open('bets.json', 'w') as f:
                  json.dump(bets, f, indent=2)
              sys.exit(0)

          # POST bets to Vercel CLV endpoint
          payload = json.dumps({'date': DATE, 'bets': targets}).encode()
          url = f'https://edge-finder-api.vercel.app/api/clv?_cb=$CB'
          req = urllib.request.Request(url, data=payload, method='POST',
              headers={'Content-Type': 'application/json', 'Accept': 'application/json'})

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read().decode()[:300]}")
              sys.exit(1)
          except Exception as e:
              print(f"Error: {e}")
              sys.exit(1)

          if result.get('error'):
              print(f"CLV error: {result['error']}")
              sys.exit(1)

          # Merge updated bets back
          updated_map = {b['id']: b for b in result.get('updatedBets', [])}
          for i, b in enumerate(bets):
              if b['id'] in updated_map:
                  bets[i] = updated_map[b['id']]

          with open('bets.json', 'w') as f:
              json.dump(bets, f, indent=2)
          print("bets.json written")

          for line in result.get('log', []):
              print(line)
          PYEOF

      - name: Rebuild BET_LOG.md
        run: |
          python3 << 'PYEOF'
          import json
          from datetime import datetime, timezone
          from collections import defaultdict

          with open('bets.json') as f:
              bets = json.load(f)

          by_date = defaultdict(list)
          for b in bets:
              by_date[b['date']].append(b)

          real_bets = [b for b in bets if b.get('confidence') != 'Paper']
          total_w   = sum(1 for b in real_bets if b.get('result') == 'WIN')
          total_l   = sum(1 for b in real_bets if b.get('result') == 'LOSS')
          total_p   = sum(1 for b in bets if b.get('result') == 'PUSH')
          total_pl  = sum(b.get('pl', 0) or 0 for b in bets)
          pending   = sum(1 for b in bets if b.get('status') not in ('SETTLED','WIN','LOSS','PUSH'))
          today     = datetime.now(timezone.utc).strftime('%Y-%m-%d')

          lines = [
              '# BET_LOG.md — Authoritative Bet Record',
              f'*Generated from bets.json — last updated: {today}*',
              '',
              f'## Overall Record: {total_w}W {total_l}L {total_p}P | Total P/L: ${total_pl:+.2f} | Pending: {pending}',
              '',
              '---',
              '',
          ]

          for date in sorted(by_date.keys(), reverse=True):
              day_bets = by_date[date]
              day_real = [b for b in day_bets if b.get('confidence') != 'Paper']
              day_w    = sum(1 for b in day_real if b.get('result') == 'WIN')
              day_l    = sum(1 for b in day_real if b.get('result') == 'LOSS')
              day_pl   = sum(b.get('pl', 0) or 0 for b in day_bets)
              lines.append(f'### {date} — {day_w}W {day_l}L | P/L: ${day_pl:+.2f}')
              lines.append('| ID | Market | Bet | Price | Edge% | Conf | Result | P/L | Closing Line | CLV% |')
              lines.append('|---|---|---|---|---|---|---|---|---|---|')
              for b in day_bets:
                  bid    = b.get('id', '')
                  market = b.get('market', '')
                  bet    = b.get('bet', '')
                  price  = b.get('price', '')
                  edge   = f"{b.get('edgePct','')}%" if b.get('edgePct') is not None else '—'
                  conf   = b.get('confidence', '')
                  result = b.get('result', b.get('status', ''))
                  pl     = f"${b.get('pl',0):+.2f}" if b.get('pl') is not None else '—'
                  cl     = b.get('closingLine') or '—'
                  clv    = f"{b.get('clv'):+.1f}%" if b.get('clv') is not None else '—'
                  lines.append(f'| {bid} | {market} | {bet} | {price} | {edge} | {conf} | {result} | {pl} | {cl} | {clv} |')
              lines.append('')

          with open('BET_LOG.md', 'w') as f:
              f.write('\n'.join(lines))
          print('BET_LOG.md rebuilt')
          PYEOF

      - name: Commit CLV updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bets.json BET_LOG.md
          git diff --cached --quiet && echo "No CLV changes" || \
            git commit -m "clv update $(TZ='America/New_York' date +'%Y-%m-%d %H:%M ET')" && git push
