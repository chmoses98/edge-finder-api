name: Debug Kalshi Markets
on:
  workflow_dispatch:
    inputs:
      date:
        required: false
        default: '2026-06-05'

permissions:
  contents: write

jobs:
  debug-kalshi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Probe Kalshi tickers
        run: python3 probe_kalshi.py 2>&1 | tee data/kalshi_probe_output.txt
      - name: Commit output
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/kalshi_probe_output.txt
          git diff --staged --quiet || (git commit -m "kalshi probe output" && git push)
